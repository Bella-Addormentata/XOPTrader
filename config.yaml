# Double-entry ledger and its wallet reconciliation control.
# See docs/ACCOUNTING-POLICY.md for the rationale behind every number here.
accounting:
  ledger_enabled: true
  # Divergence beyond tolerance for N consecutive same-signed checks.
  # Tolerance = live offer exposure + fee slack + max(floor, pct * confirmed).
  alert_pct: 0.005          # 0.5% -- above all observed dust, below one 1-XCH offer
  alert_observations: 2
  pause_pct: 0.02           # 2%   -- roughly three offers' worth
  pause_observations: 3
  # OFF until the ledger runs clean: taker fills (Steps 9d/9f) and external
  # deposits/withdrawals have no ledger event yet, so auto-pausing would halt
  # trading on legitimate activity.  Alerts still fire either way.
  pause_enabled: false
  # [S19 2026-08-23] Book completed warp bridge jobs as first-class
  # bridge_deposit/bridge_withdrawal ledger events (GIPS: external capital,
  # not P&L).  The engine reads the GUI-owned jobs DB READ-ONLY.
  bridge_ingest_enabled: true
  bridge_jobs_db_path: data/warp_jobs.db
  bridge_asset_id: fa4a180ac326e67ea289b869e3448256f6af05721f7cf934cb9901baa6b7a99d
  floor_xch_mojos: 1000000000   # 0.001 XCH -- covers fee dust
  floor_cat_mojos: 100          # 0.1 unit  -- 100x the per-leg rounding error
  fee_slack_mojos: 200000       # ~40 offer events at 5,000 mojos
  max_balance_age_blocks: 10
  # Breaches are scored over a sliding window, not required to be strictly
  # consecutive: the tolerance includes live offer exposure, which swings
  # ~100x between heartbeats as the book is re-quoted.
  observation_window: 6
  # On sustained divergence, record the unexplained amount as an `adjust`
  # leg and re-tie the books.  Without this the ledger drifts monotonically
  # (every unrecorded flow is one-directional) and the control's only end
  # state is being switched off.  With it:
  #   SELECT SUM(delta_mojos) FROM ledger_entries WHERE event_type='adjust'
  # is the running total of what the bot cannot account for.
  auto_adjust_enabled: true
  # Stablecoin peg monitor.  Accounting keeps valuing wUSDC.b/wUSDC/USDS at
  # exactly $1.00 (they are the numeraire, and a live feed in a PERSISTED
  # cost basis is the bug class removed in v0.8.0).  This surfaces a real
  # depeg instead of silently pricing it in.  NOT covered by `depeg:` below,
  # which compares a pair's own mid to a constant and is registered only for
  # BYC/wUSDC.b -- it cannot see wUSDC.b itself move.
  peg_monitor_enabled: true
  peg_external_warn_pct: 1.0   # CoinGecko usd-coin vs par: clean signal
  # Implied wUSDC.b from cex/dex ratio catches a BRIDGE depeg, which the
  # CoinGecko feed cannot. Threshold must clear this venue's structural
  # DEX-vs-CEX basis: 217 logged samples ran p50 78bps, p90 118bps, max 218bps.
  peg_implied_warn_pct: 3.0
  peg_observations: 4
