# XOPTrader Configuration (public / version-controlled)
#
# This file contains all operational tuning parameters.  It is safe to
# commit to version control.
#
# Sensitive values (wallet fingerprint, SSL paths, API keys, Telegram
# tokens, database path) belong in secrets.yaml which is gitignored.
# At startup the engine deep-merges secrets.yaml on top of this file,
# so you only need to put secret overrides there.
#
# See secrets.example.yaml for a template.
#
# Environment variable substitution:
#   Any string value may contain ${VAR} or ${VAR:-default} references.
#   ${VAR}           — replaced with the env var's value; error if unset.
#   ${VAR:-default}  — replaced with the env var's value, or "default" if unset.
#
# --- Required vs Optional Sections -------------------------------------------
#
# REQUIRED sections (engine will not start without them):
#   chia, dexie, pairs, strategy, risk, volatility, monitoring
#
# REQUIRED in secrets.yaml:
#   chia.wallet_fingerprint, chia.ssl_*_path, database.path
#
# OPTIONAL sections (omit entirely to use defaults):
#   depeg, arbitrage, coingecko, fees, inventory_aging, market_data,
#   adverse_selection, market_allocator, recovery
#
# Within required sections, individual fields are marked [REQUIRED] or
# [OPTIONAL] (with their default value) in comments below.
# ---------------------------------------------------------------------------

# --- chia: REQUIRED ----------------------------------------------------------
# Connection settings only.  Wallet fingerprint and SSL paths are in secrets.yaml.
chia:
  # Node operating mode: auto | full_node | wallet_only
  #   auto        - try full node first, fall back to wallet-only (default)
  #   full_node   - require a running Chia full node
  #   wallet_only - run with Chia wallet service only (no full node needed)
  #                 Uses wallet's synced height; fee estimation uses static fees.
  #                 Saves ~60-100 GB disk (no blockchain DB) and syncs in minutes.
  mode: auto

  # Chia RPC endpoints (local full node + wallet)
  full_node_host: "localhost"
  full_node_port: 8555
  wallet_host: "localhost"
  wallet_port: 9256
  # SSL verification for Chia RPC certificates.
  #
  # FALSE is correct for the localhost defaults above, and is what every
  # fresh install needs. Chia's RPC uses a PRIVATE CA whose certificate is
  # issued to "Chia", not "localhost", so standard peer verification fails
  # with CURL error 60 ("SSL peer certificate ... was not OK") and the bot
  # can never read the wallet -- no balances, no prices, no trading. The
  # connection is still mutually authenticated by the client certificate
  # in secrets.yaml, and it never leaves the loopback interface.
  #
  # Set this to true ONLY if you point the hosts above at a REMOTE Chia
  # node reachable over a network you do not fully control, and have a CA
  # bundle that actually validates that host.
  verify_ssl: false

# --- dexie: REQUIRED ---------------------------------------------------------
# All fields are REQUIRED.
dexie:
  # Dexie API — rate limit 50 req / 10s
  api_base: "https://api.dexie.space/v1"         # [REQUIRED]
  max_requests_per_10s: 50                        # [REQUIRED]
  claim_rewards: true                             # Auto-claim DBX liquidity rewards (default: true)

# --- pairs: REQUIRED (at least one enabled pair) ----------------------------
# Per-pair: base_asset_id, quote_asset_id, name are REQUIRED.
# All other fields (enabled, *_override, is_stablecoin, depeg_*) are OPTIONAL.
# [PEG 2026-08-26] Assets declared pegged, and to WHAT.
#
# Replaces fifteen hardcoded `quote == "wUSDC.b" || ...` comparisons that
# each independently decided an asset was worth exactly one dollar.  Par is
# now declared here, not inferred from a ticker symbol.  An asset ABSENT
# from this list has no declared value -- which is the correct answer, not a
# reason to fall back to $1.
#
# Keyed on asset_id, never on symbol: symbols collide and get reused.
#
# peg_currency lets a peg be denominated in something other than USD.
# Converting a non-USD peg into USD needs an FX rate; until one is wired in,
# a non-USD peg yields NO valuation rather than a silent 1:1 substitution.
#
# prefer_market_cross distinguishes the two kinds of pegged asset:
#   false -- fiat-collateralised wrapper (wUSDC.b, wUSDC, USDS).  One unit
#            is a claim on one dollar held by the issuer, so a market print
#            that disagrees is evidence about the ISSUER and must not mark
#            the book.
#   true  -- CDP stablecoin (BYC).  No such claim; a live cross against a
#            wrapper is a better estimate than the target it aims at, and
#            the declared par is only the fallback when no tight cross
#            exists.
#
# enforce: false RETIRES THE DECLARED PAR.  It is the switch that did not
# exist when warp.green and Circuit DAO were both reported compromised in
# August 2026 and BYC kept marking the whole book at $1 because the 1.0 was
# written in the code.
#
# ⚠ It does NOT blind the asset.  Read this before reaching for it during an
# incident.  With enforce:false the registry-gated branches stop answering,
# but an asset that is the QUOTE of an XCH-base pair still gets a factor
# derived from that pair's own mid (usd_per_xch / quote_per_xch, grade-gated
# as usual).  So flipping it on BYC does not stop BYC being valued -- it
# reroutes BYC's valuation from the declared peg to the market.
#
# That is deliberate, and for a compromised issuer it is arguably the more
# honest number: the market's view of a wound-down asset beats the par it is
# no longer holding.  It also avoids a nastier failure -- making the switch
# absolute would zero equity the moment it is flipped on the only priced
# asset, which is the S27 fail-open condition arriving by another route.
#
# If you need the asset to contribute NOTHING, disable its pairs as well.
#
# ONE CAVEAT, and it is the one that bit on 2026-08-25.  The rerouting above
# only holds while SOME OTHER enabled XCH pair can still anchor USD.  If the
# asset you unenforce is the only par wrapper the book has -- wUSDC.b was
# exactly that -- then usd_per_xch() has nothing left to anchor on and
# returns 0, the market-derived path returns 0 with it, and the asset is
# blinded rather than repriced.  That is the S27 zero-equity condition, not
# a graceful degradation.  Before flipping `enforce` on your only anchor,
# give the book a second one by declaring a par on another enabled quote
# asset. `validate_usd_anchor()` warns at startup when none is reachable.
#
# NOT CoinGecko, on this build: `usd_per_xch()` scans enabled XCH/par-wrapper
# pairs and does not read the external feed at all, so enabling it satisfies
# nobody. Teaching the anchor to prefer the external quote is S27's work
# (PR #117); until that lands, a declared par is the only anchor there is.
pegged_assets:
- asset_id: fa4a180ac326e67ea289b869e3448256f6af05721f7cf934cb9901baa6b7a99d
  symbol: wUSDC.b
  peg_currency: USD
  peg_target: 1.0
  warn_pct: 2.0
  bail_pct: 10.0
  sustained_observations: 30
  prefer_market_cross: false
  enforce: true
# The other two legacy wrappers.  No live pair quotes them today.  Declaring
# them here is what gives them a PAR of exactly $1; the old hardcoded list
# gave them that implicitly, and par is now declared, never assumed.
#
# ⚠ Undeclared does NOT mean unvalued.  An operator re-adding XCH/wUSDC or
# XCH/USDS without a declaration here still gets a MARKET-DERIVED factor
# (usd_per_xch / quote_per_xch, the same generic XCH-base branch DBX uses) --
# what they lose is the $1 par, not the valuation.  Same distinction as
# enforce:false above: retiring or omitting a declaration reroutes valuation
# to the market, it does not stop it.  To make an asset contribute nothing,
# disable its pairs.
#
# ⚠ Engine and GUI can disagree after enforce:false.  The GUI's
# pnl_usdc_expr (gui/services/database_service.py) still hardcodes $1.00 for
# wUSDC.b/wUSDC, so retiring a peg here changes engine accounting while the
# GUI keeps showing par.  Tracked as follow-up; do not read the two as
# cross-checks of each other.
- asset_id: bbb51b246fbec1da1305be31dcf17151ccd0b8231a1ec306d7ce9f5b8c742b9e
  symbol: wUSDC
  peg_currency: USD
  peg_target: 1.0
  warn_pct: 2.0
  bail_pct: 10.0
  prefer_market_cross: false
  enforce: true
# USDS is deliberately NOT declared here.  A placeholder tail would now be
# rejected at startup (asset_id must be "xch" or a 64-char hex tail), and a
# placeholder that PARSED would be worse -- it would key on a string no asset
# can match, so the declaration would sit in config looking like protection
# while doing nothing.  Add a real entry when the tail is known.
- asset_id: ae1536f56760e471ad85ead45f00d680ff9cca73b8cc3407be778f1c0c606eac
  symbol: BYC
  peg_currency: USD
  peg_target: 1.0
  warn_pct: 2.0
  bail_pct: 10.0
  sustained_observations: 30
  prefer_market_cross: true
  enforce: true
pairs:
  - base_asset_id: "xch"          # XCH native
    quote_asset_id: "fa4a180ac326e67ea289b869e3448256f6af05721f7cf934cb9901baa6b7a99d"  # wUSDC.b
    name: "XCH/wUSDC.b"
    enabled: true
  - base_asset_id: "xch"
    quote_asset_id: "ae1536f56760e471ad85ead45f00d680ff9cca73b8cc3407be778f1c0c606eac"  # BYC
    name: "XCH/BYC"
    enabled: true
  - base_asset_id: "ae1536f56760e471ad85ead45f00d680ff9cca73b8cc3407be778f1c0c606eac"  # BYC
    quote_asset_id: "fa4a180ac326e67ea289b869e3448256f6af05721f7cf934cb9901baa6b7a99d"  # wUSDC.b
    name: "BYC/wUSDC.b"
    enabled: true
    # Per-pair strategy overrides for stablecoin-vs-stablecoin pair
    gamma_override: 0.001          # Lower risk aversion — tight spreads are safe
    min_profit_margin_bps_override: 5    # Very tight — DBX subsidy offsets
    max_half_spread_bps_override: 75     # Cap spread for stablecoin pair
    tier_spacing_bps_override: [3, 5, 8, 15, 25, 40]  # Much tighter ladder
    tier_size_pct_override: [0.30, 0.25, 0.20, 0.12, 0.08, 0.05]
    min_offer_size_units_override: 1    # Drop tiers below 1 unit — prevents dust offers

    # -- Per-pair overrides that mirror a strategy-level key --
    # Each is UNSET by default: omit it and the pair uses the strategy-level
    # value of the same name.  Commented out here because unset IS the
    # default; uncomment only the ones this pair actually needs.
    # competitive_anchor_enabled_override: true            # [OPTIONAL, default: unset -> strategy.competitive_anchor_enabled]
    # competitive_anchor_max_distance_bps_override: 250.0  # [OPTIONAL, default: unset -> strategy.competitive_anchor_max_distance_bps] must be > 0
    # competitive_anchor_stride_bps_override: 20.0         # [OPTIONAL, default: unset -> strategy.competitive_anchor_stride_bps] must be > 0
    # fair_value_residual_widen_ratio_override: 0.25       # [OPTIONAL, default: unset -> strategy.fair_value_residual_widen_ratio] 0 disables residual widening here; must be >= 0
    # offer_expiry_secs_override: 172800                   # [OPTIONAL, default: unset -> strategy.offer_expiry_secs] 0 binds and means "never expire THIS pair's offers"; must outlast the hard TTL x2 safety margin

    # -- Per-pair override of RISK-level keys (concentration limits) --
    # This pair's soft / hard concentration limits for the Step 6 risk filter,
    # in place of risk.soft_limit_pct / risk.hard_limit_pct.  Each must be
    # finite in (0, 1], and the EFFECTIVE soft (override or global) must be
    # below the effective hard, or the config is rejected at load.  SYMMETRIC:
    # the same limits taper this pair's base-overweight bid AND its
    # quote-overweight ask.  A pair whose limits differ from the global pair
    # logs a warning at load.  Restart required.  Add these with the GUI
    # STOPPED: the Settings pairs table re-emits each pair from the dict it
    # loaded, so a key added while the GUI runs is dropped on its next save.
    # The values below are illustrative only.
    # soft_limit_pct_override: 0.70                        # [OPTIONAL, default: unset -> risk.soft_limit_pct]
    # hard_limit_pct_override: 0.90                        # [OPTIONAL, default: unset -> risk.hard_limit_pct]

    # -- Per-pair override of a MARKET_DATA-level key (not a strategy one) --
    # Ceiling in BASIS POINTS -- not a fraction; contrast the BBO block below.
    # Absent -> market_data.book_side_agree_max_spread_bps (5000 by default).
    # Must be finite and >= 0; 0 disables the two-sides-agree bypass for this
    # pair.  ONE-WAY: the effective value is min(this,
    # market_data.mid_gate_book_confirm_max_spread_bps), so RAISING it above
    # that gate does NOTHING -- this can only make one pair STRICTER, never
    # more permissive than the bot-wide gate.  Lowering it can cost THIS pair
    # its mid_valuation_grade (valuation falls to the S20 carry); read the
    # market_data comment on book_side_agree_max_spread_bps before setting it.
    # book_side_agree_max_spread_bps_override: 1500.0      # [OPTIONAL, default: unset -> market_data.book_side_agree_max_spread_bps]

    # -- Per-pair 24h activity-adaptive controller --
    # See strategy.activity_adaptive_spacing for what the controller does.
    # The first three mirror their strategy-level namesakes and are unset by
    # default.  The two *_max_* keys have NO strategy-level counterpart --
    # they are per-pair only, and both are read ONLY while the controller is
    # enabled for this pair.
    # activity_adaptive_spacing_override: true   # [OPTIONAL, default: unset -> strategy.activity_adaptive_spacing]
    # activity_target_fills_24h_override: 12     # [OPTIONAL, default: unset -> strategy.activity_target_fills_24h] must be > 0
    # activity_book_weight_override: 0.25        # [OPTIONAL, default: unset -> strategy.activity_book_weight] must be >= 0
    # min_profit_margin_max_bps_override: 20     # [OPTIONAL, default: unset -> 2x this pair's min_profit_margin_bps] Wide end of the margin ramp; must be > 0
    #
    # Wide end of the spacing ramp: one entry per tier, aligned with
    # tier_spacing_bps_override above (which is the NARROW end).  Unset ->
    # the ramp is flat (max == base), so spacing never moves and only the
    # margin adapts.  Every entry must be > 0.  A list SHORTER than the tier
    # count no longer leaves the later tiers at their base spacing: each is
    # carried at least one base gap outside the tier before it, because a
    # schedule that steps back INWARD would post that tier inside its
    # predecessor and the width floor then collapses both onto one price.
    # tier_spacing_max_bps_override: [12, 20, 32, 60, 100, 160]

    # [BBOPERPAIR 2026-09-01] Per-pair BBO proximity caps: "do not quote
    # further than X from the market on THIS pair".
    #
    # FRACTIONS, not bps — 0.10 means 10%. Bounded (0, 1]; 10 or 1000 are
    # REJECTED at load, because either would produce a cap that can never
    # bind, i.e. a suppression control silently switched off.
    #
    # Measured against the SAME-SIDE BBO, never the mid. That is not a
    # detail: the mid breaks precisely when a bound would bind. On 2026-08-30
    # XCH/BYC's mid read 5.575 while fair value was ~1.40, and a mid-
    # referenced 2% band would have forced correct 1.33 bids up to 5.4635 —
    # paying ~5.46 BYC for an XCH worth ~1.40, filling instantly. A 2% band
    # measured from the same side forfeits 5.6% of realized P&L; the same
    # band measured from the mid forfeits 78.4%.
    #
    # A breach SUPPRESSES the tier. It never reprices it — the disposition
    # RTS 7 Art. 20(2)(c) requires and CME, Binance, Kraken and Nasdaq all
    # implement. Absent → the strategy-level value.
    #
    # ⚠ THE PASSIVE ONE IS THE DANGEROUS ONE. Aggressive bounds a tier that
    # would EXECUTE at a dislocated price; passive bounds one that merely
    # RESTS far from a thin book, which ALWAYSOFFER widened deliberately so a
    # cost-floored ask could still participate. Tighten it and you can
    # silence a pair outright: whenever the sigma width floor exceeds the
    # bound, the innermost tier is already outside it, so every tier is.
    # Measured, a 2% passive bound withdraws XCH/BYC on 87.7% of blocks,
    # while on XCH/DBX (floor never above 141 bps) anything ≥10% never binds
    # at all. For scale: the tightest such bound the SEC imposes on a
    # blue-chip market maker is 8% from the same-side NBBO, widening to 20%
    # near the open and close and 28–30% for less liquid names.
    bbo_sanity_max_aggressive_dev_override: 0.10   # [OPTIONAL] default 0.10
    bbo_sanity_max_passive_dev_override: 0.30      # [OPTIONAL] default 0.30

    # Stablecoin peg monitoring — both sides are USD-pegged
    is_stablecoin: true
    peg_target: 1.0                # Both BYC and wUSDC.b should be $1
    depeg_warn_pct: 2.0            # Warn at 2% deviation
    depeg_bail_pct: 10.0           # Pull all quotes at 10% deviation
    depeg_sustained_blocks: 30     # Must persist ~26 min before bail
    # Stablecoin peg-anchoring: blend mid-price toward the peg target
    peg_anchor_threshold_pct: 2.0  # [OPTIONAL] Only anchor when within 2% of peg
    peg_anchor_weight: 0.60        # [OPTIONAL] Blend weight toward peg (0=ignore, 1=force to peg)
    # Stablecoin quoting modes
    stablecoin_exempt_buyonly: true       # [OPTIONAL] Don't suppress buy-only during imbalance
    stablecoin_undercut_all_tiers: true   # [OPTIONAL] Undercut competitors on all tiers
    stablecoin_flat_sizing: true          # [OPTIONAL] Equal-weight tiers instead of tapered
    stablecoin_skip_gap_aware: true       # [OPTIONAL] Skip gap-aware spacing (tight spread matters more)
  - base_asset_id: "f322a205c034fe28681829fa5a2e483ac421f0952eb1292945c8db06e0a471a6"  # wmilliETH.b
    quote_asset_id: "xch"
    name: "wmilliETH.b/XCH"
    enabled: true
    # [OPTIONAL, default: false] Revive a dead market.  Normally a pair whose
    # third-party offers all fail the 20% sanity filter has an empty book and
    # the engine refuses to quote it at all.  With revive_market the ladder is
    # priced from the external fair-value estimate instead of going silent.
    # The filter itself is never bypassed -- stale junk stays out of pricing --
    # and the engine still refuses to quote when no estimate is live OR when
    # the price feed behind it is stale (no successful CoinGecko fetch within
    # market_data.cex_freshness_threshold_sec, default 120s): a frozen feed
    # reverts the pair to silence rather than quoting yesterday's price.
    # Note the estimate may be graph-transitive rather than a direct anchor;
    # its uncertainty scales the minimum spread rather than blocking quoting.
    # Editable per pair in Settings -> Trading Pairs.
    revive_market: false
  - base_asset_id: "4cb15a8ecc85068fb1f98c09a5e489d1ad61b2af79690ce00f9fc4803c8b597f"  # wmilliETH
    quote_asset_id: "xch"
    name: "wmilliETH/XCH"
    enabled: true
  # XCH/DBX — Dexie liquidity rewards pair (135% APR bid-side, 75% APR ask-side).
  # Thin order book; enable only if you want to farm DBX incentive rewards.
  - base_asset_id: "xch"
    quote_asset_id: "db1a9020d48d9d4ad22631b66ab4b9ebd3637ef7758ad38881348c5d24c38f20"  # DBX
    name: "XCH/DBX"
    enabled: false

# --- strategy: REQUIRED ------------------------------------------------------
# Fields marked [REQUIRED] must be present; others use defaults if omitted.
strategy:
  # Avellaneda-Stoikov / GLFT parameters
  gamma: 0.01            # [REQUIRED] Risk aversion coefficient
  kappa: 1.5             # [REQUIRED] Fill intensity decay
  phi: 0.5               # [REQUIRED] Inventory skew strength (GLFT). Higher = more aggressive rebalancing. Recommended: 0.8 for skewed portfolios
  q_max: 30              # [REQUIRED] Max inventory in base units. Wallet cap (v0.7.38) prevents ask overcommit.
  min_profit_margin_bps: 35  # [REQUIRED] Never post ask below cost_basis + this margin
  high_vol_multiplier: 1.3   # [OPTIONAL, default: 1.3] Spread widening multiplier during high-vol regimes
  sigma_floor: 0.001         # [OPTIONAL, default: 0.001] Minimum annualized sigma for GLFT formula (prevents degenerate spreads when market is flat)
  offer_ttl_blocks: 600      # [REQUIRED] Soft TTL: cancel stale offers after N blocks (~8.7 hours at 600)
  # [OFFER-EXPIRY] On-chain expiry attached to offers we CREATE, in seconds.
  # Commented out because 0/unset is the default and the safe posture: no
  # timelock is attached and offers behave exactly as they always have.
  #
  # What it buys: if we ever lose the ability to cancel an offer, the chain
  # retires it for us instead of leaving it takeable indefinitely.
  #
  # What it costs, and why it is opt-in: the expiry is sent as `max_time`,
  # the ONLY one of Chia's four absolute timelock flags the reference wallet
  # honours when TAKING an offer.  Even so, a taker on an old enough wallet
  # can fail to take an offer that carries one, and we cannot survey what
  # wallets our takers run.  Enable per pair, deliberately.
  #
  # MUST exceed this bot's own hard TTL -- offer_ttl_blocks x 2 at the
  # configured strategy.block_time_seconds (52.0s) -- times a 2x safety
  # margin, because the real block rate varies.  At offer_ttl_blocks: 600
  # the floor is 124800s, so any value at or below ~34.7 hours is
  # REJECTED at startup: an expiry inside
  # our own TTL would let the chain retire offers the engine still tracks as
  # live, with no cancel ever recorded.
  # offer_expiry_secs: 172800  # [OPTIONAL, default: 0 = disabled] 48h
  num_tiers: 4               # [REQUIRED] Multi-tier offer ladder depth (4 recommended: fewer, larger tiers)
  tier_spacing_bps: [35, 100, 200, 300]  # [REQUIRED] Spread per tier (bps)
  tier_size_pct: [0.15, 0.20, 0.30, 0.35] # [REQUIRED] Capital fraction per tier (sum ≈ 1.0)
  max_half_spread_bps: 250  # [OPTIONAL, default: 250] Global cap on half-spread
  offer_fee_mojos: 10000000  # [OPTIONAL, default: 10000000] On-chain fee per offer/cancel
  # --- Triangulated fair-value guard ----------------------------------------
  # The ladder is centred on a dexie book mid.  These knobs validate that mid
  # against a weighted least-squares solve over the graph of assets and pairs,
  # re-run per pair with that pair's OWN book edge deleted.  Every key below is
  # commented out on purpose: the guard must protect an unconfigured
  # deployment, so the built-in defaults are the operational values.
  #
  # The sigma knobs are 1-SIGMA UNCERTAINTIES in bps -- the honest error bar on
  # one class of observation.  Weights are 1/sigma^2, so halving a sigma
  # quadruples that source's influence.  Nothing here is a dimensionless
  # "importance" dial and no pair is named anywhere in the implementation.
  # max_fair_value_deviation_bps: 300    # Clamp band base (0 disables clamping)
  # blind_quote_widen_pct: 50            # Extra width when no fair value exists
  # fair_value_clamp_tier_step_bps: 10   # Keep clamped tiers on distinct prices
  # fair_value_feed_sigma_bps: 100       # CoinGecko vs the on-chain market
  # [PARANCHOR] Declared pegs (pegged_assets) can anchor their asset at
  # par -- FALLBACK ONLY: a pair's solve consults them solely when it
  # finds no path without them, so live market evidence always outranks
  # a declaration.  Enforced + unsuspended assets only, every sibling
  # sharing a graph node must agree, and a stale CoinGecko fetch
  # disables the pass.  Non-USD pegs (EUR/JPY) convert through an FX
  # cross fetched in the same CoinGecko request; a missing rate means no
  # anchor, never 1:1.  Every sigma pairing must clear
  # fair_value_max_sigma_bps (200) -- the loader warns per violation.
  # fair_value_par_sigma_bps: 100        # wrappers (prefer_market_cross: false)
  # fair_value_par_market_sigma_bps: 140 # market-determined pegs (e.g. BYC)
  # fair_value_amm_sigma_bps: 50         # TibetSwap pool implied price
  # fair_value_amm_max_age_sec: 300
  # fair_value_min_book_sigma_bps: 10    # Floor on a book mid's uncertainty
  # fair_value_stale_sigma_bps_per_print: 5   # Per heartbeat since the mid MOVED
  # fair_value_depth_ref_bps: 30         # Thin-book term, decays as 1/sqrt(n)
  # fair_value_max_sigma_bps: 200        # Above this: UNAVAILABLE, widen not clamp
  # fair_value_tight_sigma_bps: 150      # At or below: highest confidence tiers
  # fair_value_sigma_band_mult: 1.0      # band = max_dev + mult * solved sigma
  # fair_value_residual_widen_ratio: 0.5      # Widen on book-vs-graph disagreement
  # fair_value_residual_widen_floor_bps: 150  # Ignore disagreements below this
  #
  # Order-book micro-price blend schedule.  The order-book mid weights each
  # side's VWAP by the OPPOSITE side's depth (Stoikov), which is right on a
  # tight book and pathological on a wide one -- the weighted estimate can be
  # dragged clean outside the BBO, which is how BYC/wUSDC.b came to publish a
  # "mid" sitting exactly on its own best ask.  The micro-price weight
  # therefore falls linearly from 1 to 0 as the relative spread travels from
  # narrow to wide, after which the plain BBO midpoint is used.  Measured
  # snapshot spread p50s for the week to 2026-08-01: XCH/DBX 63, XCH/wUSDC.b
  # 237, XCH/BYC 794, BYC/wUSDC.b 1163 bps.  Commented out on purpose -- the
  # defaults must protect an unconfigured deployment.  wide must exceed narrow.
  # microprice_narrow_bps: 200           # At or below: micro-price used whole
  # microprice_wide_bps: 800             # At or above: plain BBO midpoint only
  #
  # Published-mid band clamp.  The blend above runs AFTER the order-book mid
  # was clamped to its own BBO, so the PUBLISHED mid can leave the book again
  # whenever the CEX or AMM disagree.  While the dex book is two-sided and
  # fresh, the blended mid is therefore clamped back to that BBO widened by
  #   band_bps = max(published_mid_band_floor_bps (default 150),
  #                  published_mid_band_spread_frac * book_spread_bps)
  # A wide book is a weak claim about location, so an honest external
  # reference is allowed to pull proportionally further outside it, while a
  # tight book gets the flat floor.  A binding clamp logs at warning level.
  # The clamp is skipped entirely when the dex book is stale or one-sided --
  # a stale book is history and should not pin fresh external data.
  published_mid_band_spread_frac: 0.25 # [OPTIONAL, default: 0.25] Band as a fraction of the book's own relative spread; must be >= 0
  # Startup market analysis: observe this many blocks before trading begins.
  # 0 = skip analysis and start trading immediately (default).
  # Example: 20 blocks (~17 min at 52 s/block).
  startup_analysis_blocks: 0
  # [T4-02] Reorg protection: require N confirmations before accepting a fill.
  # Default 6 blocks (~5 min).  0 = accept fills immediately (no protection).
  confirmation_depth_blocks: 6          # [OPTIONAL, default: 6]
  # [T4-11] Offer state reconciliation: full wallet-vs-state check every N blocks.
  # Default 20 blocks (~17 min).  0 = disabled.
  reconciliation_interval_blocks: 20     # [OPTIONAL, default: 20]

  # -- Minimum balance management --
  # Prevents zero-balance lockout by reserving a minimum in each asset.
  fee_reserve_xch: 1.0                # [OPTIONAL, default: 1.0]  XCH held back for on-chain fees
  fee_min_spendable_xch: 0.01          # [OPTIONAL, default: 0.01] Minimum XCH that must remain spendable
  taker_min_spendable_xch: 0.25        # [OPTIONAL, default: 0.25] Preflight floor for take_offer-based strategies
  block_time_seconds: 52.0             # [OPTIONAL, default: 52.0] CHIA block-time assumption for freshness checks
  min_spendable_reserve_pct: 0.10      # [OPTIONAL, default: 0.25] Suppress side when spendable/confirmed < this
                                       #   Lower if most inventory is locked in offers (e.g. depleted CATs).
  xch_cycle_commit_frac: 0.5           # [OPTIONAL, default: 0.5] Max fraction of free XCH (whole-coin terms,
                                       # above the fee reserve) one posting cycle may lock into SPEND-SIDE
                                       # offers. Buy-XCH offers are cap-exempt (floor-checked only), so 0.0
                                       # stops spend-side posting but is not a full shutdown. The ledger
                                       # counts actual UTXO + fee-coin locks, so a requote burst can no
                                       # longer walk spendable XCH to zero.
  arb_reserve_coins: 2                 # [OPTIONAL, default: 2]   Coins kept unallocated for arb takes
  min_reserve_units: 1.0               # [OPTIONAL, default: 1.0]  Absolute floor per coin (units)
  min_offer_size_units: 1.0            # [OPTIONAL, default: 1.0]  Min offer size in base-asset units; tiers below this are dropped
  max_offer_size_units: 5.0            # [OPTIONAL, default: 5.0]  Max offer size per tier for XCH-base pairs; 0 = no cap
  min_trading_units: 10.0              # [OPTIONAL, default: 10.0] Desired minimum for active trading
  auto_rebalance_enabled: true         # [OPTIONAL, default: true] Post buy-side-only to acquire depleted assets
  ratio_rebalance_enabled: true        # [OPTIONAL, default: true] Enforce target-ratio balancing with hysteresis
  ratio_target: 0.50                   # [OPTIONAL, default: 0.50] Target base value ratio (0.5 = balanced)
  # Optional per-pair overrides (base-value ratio for each pair)
  # ratio_target_by_pair:
  #   XCH/wUSDC.b: 0.62
  #   DBX/wUSDC.b: 0.40
  ratio_band_enter: 0.10               # [OPTIONAL, default: 0.10] Enter rebalance outside target +/- this
  ratio_band_exit: 0.05                # [OPTIONAL, default: 0.05] Exit rebalance once back inside target +/- this
  ratio_force_one_sided: true          # [OPTIONAL, default: true] Force one-sided posting while rebalancing
  ratio_tier_size_scale_min: 0.35      # [OPTIONAL, default: 0.35] Overweight side minimum size multiplier
  ratio_tier_size_scale_max: 1.15      # [OPTIONAL, default: 1.15] Underweight side maximum size multiplier
  xch_ask_throttle_enabled: true       # [OPTIONAL, default: true] Enable smooth XCH ask throttling
  xch_ask_throttle_caution_xch: 2.0    # [OPTIONAL, default: 2.0] Start mild ask throttling below this
  xch_ask_throttle_low_xch: 1.0        # [OPTIONAL, default: 1.0] Stronger ask throttling below this
  xch_ask_throttle_critical_xch: 0.35  # [OPTIONAL, default: 0.35] Keep only defensive outer ask below this
  xch_ask_throttle_aggressiveness: 1.0 # [OPTIONAL, default: 1.0] <1 gentler, >1 more protective

  # -- Pace controller (default OFF) --
  # Sells an overweight CAT QUOTE asset (pace_assets) down toward its
  # asset_target_allocations band through the bids of its XCH/<asset> pairs,
  # at a bounded daily budget, never above the independent fair value.  The
  # risk limits still apply to every pace bid.  When enabled: every asset needs
  # a target and a tolerance > 0 and must not be XCH; every ENABLED pair
  # touching it must be XCH/<asset> (base xch) and not a stablecoin pair;
  # pace_max_fair_value_sigma_bps <= fair_value_max_sigma_bps; and
  # market_data.cex_freshness_threshold_sec must be finite and > 0.  Every pace
  # change needs a restart, turning pace off included: stop the GUI (closing it
  # stops the engine it launched; stop any engine it did not launch as well),
  # edit this file, check `git diff config.yaml`, then restart.  Before
  # restarting, confirm no `xop_trader` process is still running: the engine
  # has no single-instance guard, and a GUI stop that cannot kill it only logs
  # `Engine process could not be killed.`  Edit only with the GUI stopped: a
  # Settings Save rewrites the file from what the GUI last loaded, so a key
  # changed on disk meanwhile reverts and a key added meanwhile is deleted.
  # This is config.yaml only: keys added to secrets.yaml survive
  # (`config_split.py` merges onto the existing file), and the pairs list is
  # rewritten position by position from the GUI's load-time list
  # (`config_split.py:217-236`), so a pair added or reordered on disk is
  # overwritten too.  A live disable from the GUI is NOT supported: after
  # Settings > Load, Save stays disabled until a setting is edited, so no
  # reload reaches the engine, and `git diff` shows false while pace stays on.
  # If a live disable is ever attempted through a real Settings edit plus Save,
  # only the engine log line "[RELOAD] pace controller DISABLED live" confirms
  # it, never `git diff`.  In dry run pace stays DataUnavailable (no balance
  # refresh runs).  Block counts are PEAK heights (4,608 per day).
  # pace_enabled: false                  # [OPTIONAL, default: false] master switch
  # pace_assets: []                      # [OPTIONAL, default: []] CAT symbols, e.g. [BYC]; never XCH
  # pace_horizon_blocks: 64512           # [OPTIONAL, default: 64512 = 14 days] [4608, 414720]
  # pace_enter_tol_mult: 1.5             # [OPTIONAL, default: 1.5] (0, 10]; activate above target + mult x tol
  # pace_exit_tol_mult: 1.0              # [OPTIONAL, default: 1.0] [0, 10), below enter; stop at target + mult x tol
  # pace_max_resting_frac: 0.5           # [OPTIONAL, default: 0.5] (0, 1]; resting size <= frac x daily budget
  # pace_min_tier_units: 1.0             # [OPTIONAL, default: 1.0] (0, 1e6] base units per tier
  # pace_max_tier_units: 5.0             # [OPTIONAL, default: 5.0] (0, 1e6] base units per tier; >= min
  # pace_max_tiers: 3                    # [OPTIONAL, default: 3] [1, 16] bid tiers per pair
  # pace_tighten_step_bps: 25            # [OPTIONAL, default: 25] [1, 1000] price-tightening quantum
  # pace_tighten_max_bps: 300            # [OPTIONAL, default: 300] [0, 5000]; 0 = size-only pacing
  # pace_min_edge_bps: 50                # [OPTIONAL, default: 50] (0, 2000] minimum edge below fair value
  # pace_edge_sigma_mult: 1.0            # [OPTIONAL, default: 1.0] [0, 5]; edge = max(min_edge, mult x fair-value sigma)
  # pace_max_fair_value_sigma_bps: 200   # [OPTIONAL, default: 200] (0, 2000]; a fair value above this sigma is unusable
  # pace_max_balance_age_blocks: 20      # [OPTIONAL, default: 20] [1, 4608] freshness bound on cached wallet balances
  # pace_reprice_min_bps: 50             # [OPTIONAL, default: 50] (0, 1000] minimum improvement to reprice a pace bid
  # pace_reprice_min_age_blocks: 96      # [OPTIONAL, default: 96] [12, 4608] minimum age to reprice a pace bid

  # -- Wall-aware retail niche pricing --
  # On Chia DEX, offers are atomic (all-or-nothing).  Small traders cannot
  # take large "wall" offers (e.g. 100 XCH) and must use our smaller ones.
  # When walls are detected, the engine widens spreads to capture a retail
  # premium rather than futilely undercutting walls it can't match on size.
  wall_size_threshold_xch: 20.0        # [OPTIONAL, default: 20.0]  Offers >= this are "walls"
  wall_niche_premium_pct: 0.15         # [OPTIONAL, default: 0.15]  Spread widening factor (15%)

  # -- Smart orphan management --
  # Cost-aware evaluation of offers found in the wallet on startup that
  # aren't in the engine's database.  Instead of blindly cancelling (wasting
  # fees and creating a zero-offer gap), evaluates each orphan against the
  # current market mid-price and adopts well-priced ones.
  #
  # Academic basis:
  #   Guéant, Lehalle & Fernandez-Tapia (2013) "Dealing with the Inventory Risk"
  #   Gao & Wang (2020) "Optimal market making in the presence of latency"
  #   Aït-Sahalia & Saglam (2017) "High frequency market making"
  orphan_adopt_enabled: true           # [OPTIONAL, default: true]   Enable cost-aware evaluation
  orphan_adverse_threshold: 0.02       # [OPTIONAL, default: 0.02]   Max adverse deviation to adopt (2%)
  orphan_max_adopt_age_blocks: 120     # [OPTIONAL, default: 120]    Max orphan age (~104 min)
  orphan_inventory_bonus: 0.01         # [OPTIONAL, default: 0.01]   Extra tolerance for inventory helpers

  # -- Gap-aware dynamic tier spacing --
  # Analyses the competing order book for price gaps and shifts tier
  # spacing toward underserved ranges.  Captures spread competitors miss.
  gap_aware_spacing: true              # [OPTIONAL, default: true]  Enable/disable
  min_gap_bps: 50.0                    # [OPTIONAL, default: 50]    Min gap width to target
  max_gap_scan_bps: 1500.0             # [OPTIONAL, default: 1500]  Max scan distance from mid
  gap_blend_factor: 0.6                # [OPTIONAL, default: 0.6]   0=baseline, 1=full gap shift

  # -- Competitive anchor pricing --
  # Instead of spacing tiers from mid, anchor Tier 0 to the best competing
  # offer on each side and step outward.  Ensures top-of-book placement.
  # Mutually exclusive with gap-aware spacing (anchor takes priority).
  # Falls back to mid-based spacing when no competing offers exist.
  competitive_anchor_enabled: false     # [OPTIONAL, default: false] Enable anchor pricing
  competitive_anchor_max_distance_bps: 500.0  # [OPTIONAL, default: 500] Max anchor dist from mid
  competitive_anchor_stride_bps: 65.0   # [OPTIONAL, default: 65]  Inter-tier spacing from anchor

  # -- 24h activity-adaptive tier margin and spacing --
  # A slow feedback controller on TRADE FLOW, not on price.  Per side it
  # counts confirmed fills over the trailing lookback window, adds a weighted
  # count of the resting competing offers on that side, and divides by the
  # target.  The resulting activity ratio (clamped to [0, 1]) interpolates
  # BOTH the profit margin and the tier spacing between the base schedule
  # (min_profit_margin_bps / tier_spacing_bps, incl. their per-pair
  # overrides) and a per-pair maximum schedule.  At or above the target the
  # base schedule is used unchanged; at zero activity the maximum is used.
  #
  # The coupling is CROSS-SIDE: bid activity drives the ASK schedule and ask
  # activity drives the BID schedule.  Bids filling means base inventory is
  # being replenished, so the ask side can afford to tighten and sell it;
  # when nothing is being replenished the ask widens to demand a higher
  # liquidity premium and protect inventory.
  #
  # Off by default.  Note that with the controller ON but no per-pair maximum
  # configured, the spacing maximum equals the base spacing (spacing does not
  # move at all) and the margin maximum is 2x min_profit_margin_bps.  The
  # maxima are per-pair only -- see tier_spacing_max_bps_override and
  # min_profit_margin_max_bps_override in the pairs: section.
  activity_adaptive_spacing: false     # [OPTIONAL, default: false] Enable the 24h activity controller
  activity_target_fills_24h: 24        # [OPTIONAL, default: 24]    Per-side activity that restores the base schedule; must be > 0
  activity_book_weight: 0.5            # [OPTIONAL, default: 0.5]   Weight of one resting competing offer vs. one confirmed fill; must be >= 0
  activity_lookback_blocks: 1662       # [OPTIONAL, default: 1662]  Fill-count window (~24 h at 52 s/block); must be > 0. No per-pair override

  # -- Adverse-selection-aware tier sizing --
  # On slow blockchains (Chia ~52 s/block), tier 0 (tightest) is most
  # vulnerable to informed traders.  This reduces inner-tier size and
  # redistributes capital to safer outer tiers.
  adverse_selection_sizing: true       # [OPTIONAL, default: true]  Enable/disable
  adverse_selection_decay: 0.7         # [OPTIONAL, default: 0.7]   Lower = more outer-heavy
  adverse_selection_sigma_threshold: 2.0   # [OPTIONAL, default: 2.0]  Halve decay above this
                                           # ANNUALIZED vol (2.0 = 200%; measured baseline is
                                           # 0.4-1.9, so only extreme regimes fire)

  # -- Cross-pair correlated inventory skewing (Guéant 2019) --
  # When multiple pairs share a common asset (e.g. XCH appears in XCH/BYC and
  # XCH/wUSDC.b), the skew from one pair's inventory can bleed into the other.
  cross_pair_skew_enabled: true         # [OPTIONAL, default: true]
  cross_pair_skew_phi: 0.30             # [OPTIONAL, default: 0.30]  Cross-pair skew strength. Recommended: 0.50 for portfolios with shared assets across pairs

  # -- Coin pool: pre-split XCH into smaller UTXOs for concurrent offers --
  coin_pool_target_count: 12            # [OPTIONAL, default: 12]   Target number of XCH coins. Lower (e.g., 3) for small portfolios
  coin_pool_target_xch: 2.0             # [OPTIONAL, default: 2.0]  Target XCH per coin. Lower (e.g., 0.5) for small portfolios
  coin_pool_interval_blocks: 5          # [OPTIONAL, default: 5]    Check interval (~4 min)

  # -- CAT coin pool: pre-split BYC, wUSDC.b etc. for concurrent offers --
  cat_coin_pool_target_count: 0          # [OPTIONAL, default: 10]  Target coins per CAT (0=disabled)
  cat_coin_pool_target_units: 10.0       # [OPTIONAL, default: 50.0] Target display units per coin

  # -- AMM blend weight --
  # Weight of the TibetSwap AMM implied price in the composite mid-price.
  #
  # KEEP THIS AT 0.  The same AMM sample is the independent reference the
  # fair-value guard measures every ladder tier against.  Giving it weight
  # here would let it move the ladder centre it is supposed to be checking,
  # so the guard would be validating a price it had itself set.
  amm_blend_weight: 0.0                # [OPTIONAL, default: 0.0]  >0 re-creates the validation cycle

# --- risk: REQUIRED ----------------------------------------------------------
# First 5 fields are REQUIRED; circuit breaker fields are OPTIONAL.
risk:
  # [S31] Dead man's switch: cancel every resting offer if no heartbeat cycle
  # completes for this many seconds.  0 disables it.
  #
  # Offers outlive the process meant to manage them, and that has now cost
  # money twice -- six four-hour-old bids filling in one second when the node
  # came back (2026-08-25), and ten offers orphaned by a stray --dry-run
  # (2026-08-26).  The watchdog runs on its own thread with its own wallet
  # connection, because the engine is single-threaded and a watchdog sharing
  # that thread is starved by exactly the stall it watches for.
  #
  # 600 is deliberate, not round: observed cycles run 3.2-13.9s against a
  # pathological 3.96 HOURS, so ten minutes sits three orders of magnitude
  # above normal and far below pathological.
  watchdog_stall_seconds: 600

  # Inventory limits
  soft_limit_pct: 0.60   # [REQUIRED] Begin aggressive skewing
  hard_limit_pct: 0.80   # [REQUIRED] Pull quotes on overweight side (must > soft_limit_pct)
  single_cat_cap_pct: 0.12  # [REQUIRED] Max portfolio % in one CAT
  # Position sizing
  kelly_fraction: 0.5    # [REQUIRED] Half-Kelly
  max_capital_per_pair_pct: 0.20  # [REQUIRED] Max fraction of total portfolio value for any pair. Raise to 0.85 if one asset dominates and needs selling
  # Circuit breakers (all OPTIONAL -- defaults shown)
  max_drawdown_frac: 0.10       # [OPTIONAL, default: 0.10] Peak-to-trough fraction
                                # of PORTFOLIO EQUITY that pauses the engine
                                # (renamed 2026-08-04 from max_drawdown_pct, which
                                # measured against the P&L high-water mark)
  loss_window_blocks: 1152      # [OPTIONAL, default: 1152]
  max_window_loss_bps: 500      # [OPTIONAL, default: 500] 0 = disabled

  # [S20 2026-08-24] Heartbeats an asset's last-known USD price may be
  # carried without a fresh valuation-grade print before equity is declared
  # DEGRADED.  Degradation freezes the drawdown PEAK; it does NOT disarm
  # either breaker -- both stay armed and keep comparing against the frozen
  # peak, because a risk control that switches itself off while the engine
  # keeps trading is worse than one measuring from an imperfect anchor.
  # Peak updates resume after 10 consecutive clean cycles.  The carried
  # VALUE keeps being used throughout -- a data gap must not read as a
  # crash.  At the observed ~17-21 s heartbeat cadence 720 is about
  # 3.5-4.2 hours.  0 disables the expiry.
  valuation_carry_ttl_blocks: 720  # [OPTIONAL, default: 720]

  # Flash-crash detector: how many blocks of price history the drawdown
  # scan considers (one entry per block; ~18.75 s each).  0 scans the whole
  # retained buffer (~1000 blocks) -- the pre-S12 behaviour, under which a
  # single junk ticker print held a GLOBAL posting halt until the buffer
  # evicted it, hours after the market had retraced.  Default 100 matches
  # recovery_stable_blocks_phase2: a drop no longer visible inside the
  # recovery window is not a FLASH crash.
  flash_crash_window_blocks: 100  # [OPTIONAL, default: 100]

  # Circuit-breaker auto-rebalance (enables loss manager for stuck positions)
  circuit_breaker_enabled: true          # [OPTIONAL, default: true]
  circuit_breaker_hard_limit_ratio: 0.80 # [OPTIONAL, default: 0.80]
  circuit_breaker_age_multiplier: 2.0    # [OPTIONAL, default: 2.0]
  circuit_breaker_max_loss_bps: 100      # [OPTIONAL, default: 100]

# --- volatility: REQUIRED ----------------------------------------------------
volatility:
  # Yang-Zhang hybrid estimator
  lookback_blocks: 200   # [REQUIRED] ~2.9 hours
  yz_alpha: 0.34         # [REQUIRED] Yang-Zhang optimal weight
  # [T5-CR6] Multi-block candle aggregation: aggregate N blocks into one OHLC
  # candle to recover H/L variation when >90% of blocks are degenerate.
  # Default 10 (~8.7 min).  1 = no aggregation (legacy).
  candle_aggregation_blocks: 10  # [OPTIONAL, default: 10]

# --- monitoring: REQUIRED ----------------------------------------------------
# prometheus_port is REQUIRED.  Telegram tokens belong in secrets.yaml.
monitoring:
  # Prometheus
  prometheus_port: 9090             # [REQUIRED]

# --- depeg: OPTIONAL (omit section to disable depeg monitoring) --------------
# Stablecoin depeg detection — global settings.
# Per-pair thresholds are set in each pair's is_stablecoin / depeg_* fields.
# All fields are OPTIONAL with defaults.
depeg:
  enabled: true                    # Master switch for depeg monitoring
  default_warn_pct: 2.0            # Default warn threshold (% off peg)
  default_bail_pct: 10.0           # Default bail threshold (% off peg) — pull all quotes
  default_sustained_blocks: 30     # Deviation must persist N blocks before bail (~26 min)
  auto_disable_pair: true          # Automatically disable pair on bail-out
  alert_on_warn: true              # Send Telegram alert on peg warning
  alert_on_bail: true              # Send Telegram alert on bail-out

# --- arbitrage: OPTIONAL (omit section to use defaults) ----------------------
# Arbitrage detection — triangular, CEX-DEX, cross-DEX, cross-bridge.
# All thresholds are in basis points (bps).  1 bps = 0.01%.
# All fields are OPTIONAL with defaults.
arbitrage:
  enabled: true                         # Master switch for arb scanning

  # Triangular arb (XCH -> A -> B -> XCH)
  triangular_min_profit_bps: 30         # Min net profit after all fees/slippage
  triangular_slippage_bps: 10           # Per-leg slippage estimate
  cex_reference_half_spread_bps: 10     # [OPTIONAL, default: 10] Synthetic half-spread around CoinGecko mid
  midpoint_recycling_enabled: false     # [EXPERIMENTAL] Near-mid ask taker for inventory recycling
  midpoint_recycling_pairs: ["XCH/wUSDC.b"]
  midpoint_recycling_band_bps: 20      # [OPTIONAL, default: 20] Slack above the derived minimum discount floor
  midpoint_recycling_min_take_xch: 0.10
  midpoint_recycling_max_take_xch: 0.25
  midpoint_recycling_cooldown_blocks: 4
  midpoint_recycling_max_takes_per_block: 1
  midpoint_recycling_daily_take_xch_cap: 2.0
  midpoint_recycling_epoch_blocks: 4608
  midpoint_recycling_min_expected_edge_bps: 5
  midpoint_recycling_fee_buffer_bps: 2
  midpoint_recycling_toxicity_buffer_bps: 6
  midpoint_recycling_slippage_buffer_bps: 2
  midpoint_recycling_inventory_ratio_cap: 0.60
  midpoint_recycling_require_cex_ref: true
  midpoint_recycling_max_cex_age_blocks: 10
  midpoint_recycling_vpin_max: 0.70
  triangular_per_leg_fee_bps: 5         # Blockchain settlement fee per hop

  # CEX-DEX arb (dexie vs OKX/MEXC/Gate)
  cex_dex_min_edge_bps: 50              # Min raw edge to flag opportunity
  cex_dex_max_edge_bps: 500             # Reject edges above this (stale data)
  cex_fee_bps: 10                       # CEX taker fee (OKX VIP0 = 10)
  cex_dex_confidence_cap: 0.25          # [OPTIONAL, default: 0.25] Hard cap on CEX-DEX confidence.
                                        #   CoinGecko data is aggregated/delayed and vulnerable to
                                        #   manipulation.  Capped below min_confidence_threshold so
                                        #   CEX-DEX signals are logged but not acted upon by default.

  # Cross-DEX arb (dexie order book vs TibetSwap AMM)
  cross_dex_min_edge_bps: 15            # Lower — both legs are on-chain atomic
  tibetswap_fee_bps: 70                 # TibetSwap v2: 0.7%

  # Cross-bridge arb (wUSDC vs wUSDC.b)
  cross_bridge_min_edge_bps: 20         # Min divergence for same-underlying arb
  bridge_cost_bps: 15                   # warp.green bridge round-trip cost

  # Crossed-book arb (intra-DEX, Dexie has no matching engine)
  crossed_book_enabled: true            # Take crossed-book offers for instant profit
  crossed_book_min_edge_bps: 10         # Min edge in bps (low: zero bridge risk)
  crossed_book_max_take_xch: 5.0        # Max XCH to risk per take per block
  cancel_worst_to_free: true            # [OPTIONAL, default: true] Cancel worst offer to free coin for arb

  # Cross-stablecoin arb (BYC ~= wUSDC.b ~= $1; compare XCH/BYC vs XCH/wUSDC.b)
  cross_stable_arb_enabled: true        # Take offers when cross-market edge found
  cross_stable_min_edge_bps: 15         # Min edge in bps after normalisation
  cross_stable_max_take_xch: 5.0        # Max XCH to risk per take per block
  peg_arb_enabled: true                 # Take offers that cross the $1 peg on stablecoin pairs
  peg_arb_min_edge_bps: 5               # Min bps above/below peg to trigger (5 = 0.05%)
  peg_arb_max_take_units: 50            # Max base-asset units per take (e.g. 50 BYC)
  peg_arb_max_inventory_ratio: 0.70     # Suppress takes beyond 70:30 balance (0.5 = 50:50)

  # General
  max_position_size: 100                # Max base-asset units per arb trade
  default_confidence: 0.75              # Base confidence when depth unknown
  min_confidence_threshold: 0.40        # Discard opportunities below this

# --- coingecko: OPTIONAL (omit section to disable CEX price reference) -------
# CoinGecko external price reference — provides CEX-grade mid-prices
# for assets with CoinGecko listings.  All fields are OPTIONAL with defaults.
coingecko:
  enabled: true
  # base_url: "https://api.coingecko.com/api/v3"   # Default; override for pro tier
  coin_ids: [chia, ethereum, usd-coin]              # CoinGecko coin identifiers
  polling_interval_ms: 30000                        # Poll every 30 s (free tier safe)
  # request_timeout_ms: 15000
  # connect_timeout_ms: 10000
  # max_retries: 3
  # retry_base_delay_ms: 1000
  # rate_limit_max_requests: 10                     # 10 req per 60 s window
  # rate_limit_window_ms: 60000
  # curl_thread_pool_size: 2
  # api_key belongs in secrets.yaml

# --- tibetswap: OPTIONAL (omit section entirely to use the defaults) ---------
# On-chain TibetSwap v2 AMM reserves.  Provides an independent,
# arbitrage-anchored marginal price for every pair with an XCH leg; feeds
# ArbitrageDetector cross-DEX scanning and the AMM blend in the market data
# feed.  Public, unauthenticated API -- no key required.
#
# Endpoints used:
#   GET {base_url}/pairs?skip=&limit=   -- pool directory (asset_id -> pair_id)
#   GET {base_url}/pair/{pair_id}       -- live reserves for one pool
#
# Every key below is commented out because the built-in default is the
# operational value.  A failed poll is logged and skipped; cached reserves are
# retained and the heartbeat continues.
tibetswap:
  enabled: true
  # base_url: "https://api.v2.tibetswap.io"
  # polling_interval_ms: 60000     # ~1 Chia block; minimum accepted is 5000
  # request_timeout_ms: 15000
  # connect_timeout_ms: 10000
  # max_retries: 3                 # Retries on 429 / 5xx (exponential backoff)
  # retry_base_delay_ms: 1000
  # rate_limit_max_requests: 30    # 30 req per 60 s window
  # rate_limit_window_ms: 60000
  # curl_thread_pool_size: 2
  # page_limit: 500                # Page size for the /pairs directory
  # max_pools: 5000                # Paging guard
  # directory_refresh_ms: 3600000  # asset_id -> pair_id cache TTL (1 h)

                 # Fee floor (5K mojos, ~2x typical mempool estimate
# --- fees: OPTIONAL (omit section to use static offer_fee_mojos) -------------
# Fee budget tracking and dynamic fee selection (T4-03).
# All fields are OPTIONAL with defaults.
fees:
  enabled: true                       # Master switch for fee tracking
  daily_budget_mojos: 10000000000     # Max fees per 24h rolling window (0.01 XCH)
  fee_to_gain_max_ratio: 0.30        # Skip tier if round-trip fee > 30% of expected gain
  cancel_cost_multiplier: 2.0        # Round-trip multiplier: fee×M is used in the gain check
                                      # (2.0 = post + cancel; >2.0 adds margin for adaptive fee spikes)
  min_fee_mojos: 5000                 # Fee floor (5K mojos, ~2x typical mempool estimate)
  max_fee_mojos: 100000000           # Fee ceiling (0.0001 XCH)
  adaptive_enabled: true             # Query full node get_fee_estimate for mempool-aware fees
  fee_window_blocks: 1662            # Rolling window for budget (~24h at 52s/block)
  fee_estimate_target_seconds: 300   # Target inclusion time for fee estimate (300=5min, low urgency)

  # -- [S67] Cost-aware estimate and the closed-loop fee controller ----------
  # Both ship OFF; with both off every fee is what it was before they existed.
  # Why: with Chia blocks ~97% full the node admits a spend only at >= 5 mojos
  # per unit of CLVM cost and refuses the rest (INVALID_FEE_TOO_CLOSE_TO_ZERO).
  # The old fee was the node's estimate for a PLAIN XCH SEND (9.4M cost) paid
  # for CAT cancels (42M) and takes (93M-212M), and nothing checked whether our
  # own spends confirmed.  Design and evidence: cpp/include/xop/strategy/
  # fee_controller.hpp.  EVERY block count below is a PEAK height: 4,608 per
  # day, 18.75 s each -- not the ~52 s transaction-block figure used above.
  #
  # NOTE fee_window_blocks above is compared against peak heights too, so 1662
  # is ~8.7 hours, not 24: daily_budget_mojos is really a per-8.7-hour budget.
  #
  # cost_aware_estimate: false       # Ask the node for a fee RATE (explicit cost) and
  #                                  # scale it by the action's own CLVM cost.  Changes
  #                                  # fees paid even with the controller off (about
  #                                  # 4.5x for a CAT cancel).  Implied by the controller.
  # controller_enabled: false        # Master switch.  Needs enabled: true and min_fee_mojos > 0.
  #                                  # Raises the fee rate fast when our spends are not
  #                                  # confirming; lowers it by scheduled probes.
  # controller_target_delay_blocks: 8   # A spend of ours should confirm within this many
  #                                  # peak heights (8 = 150 s).  [1, 4608]
  # controller_kp: 1.0               # Gains, log2 fee units per target-delay of lateness.
  # controller_ki: 0.5               # Each in [0, 16].  ki: 0 means a sustained error
  # controller_kd: 0.5               # raises once and then no more (warned at startup).
  # controller_max_error: 2.0        # Cap on one observation's lateness; what a hard signal
  #                                  # (force-delete, sent_to fee error) reports.  (0, 16]
  # controller_max_step_up: 1.0      # Cap on one observation's raise, log2 (1.0 = x2).  (0, 8]
  # controller_min_raise: 1.0        # A stuck spend keeps raising the fee until it is this
  #                                  # far (log2) above what that spend paid.  (0, 8]
  # controller_warmup_observations: 3   # Observations consumed before the fee may move.  [0, 1000]
  # controller_probe_fraction: 0.15  # Probe-down step: lower the fee by this fraction ...
  # controller_probe_after_confirmations: 8   # ... after this many on-target confirmations ...
  # controller_probe_confirmations: 3         # ... good after this many more at the lower fee.
  # controller_probe_fail_bump: 0.10 # A failed probe returns to last-good times (1 + this).  [0, 1]
  # controller_probe_backoff_cap: 256   # Re-testing a fee that already failed waits 2x longer
  #                                  # each time, up to this many confirmations.
  # controller_ff_margin: 1.10       # Multiplier on the node's estimate and its admission
  #                                  # floor, which act as a FLOOR under the learned fee.  [1, 4]
  # controller_ff_max_age_blocks: 32 # A node reading older than this is dropped (node
  #                                  # unreachable): the learned fee then stands alone.
  # controller_budget_reserve_cancels: 25   # Budget held back from offer-attached fees: this
  #                                  # many CAT cancels at today's price, CAPPED at half of
  #                                  # daily_budget_mojos so it can never exceed the budget
  #                                  # itself.  [0, 1000]
  #                                  # WHAT IT DOES: attached fees start being squeezed while
  #                                  # this much of the window is still unspent, instead of
  #                                  # when the window empties.  WHAT IT DOES NOT DO: bound
  #                                  # what attached fees spend.  min_fee_mojos overrides it
  #                                  # unconditionally, nothing refuses to post on budget
  #                                  # grounds with the controller on, and a fee is booked for
  #                                  # every offer POSTED -- so a ladder can still drive the
  #                                  # window past the budget at min_fee_mojos per tier.  Only
  #                                  # daily_budget_mojos prevents that.  Cancels are funded
  #                                  # because they are never shaped by the budget at all.
  #                                  # With the controller ON an exhausted budget degrades the
  #                                  # OFFER-ATTACHED fee to min_fee_mojos (one FeeBudgetBound
  #                                  # alert); it never returns 0 = "skip Step 8", which also
  #                                  # stopped cancels.  A PER-OFFER CANCEL or a TAKE is never
  #                                  # degraded (the bulk sweep is the exception, see below):
  #                                  # min_fee_mojos on a 42.3M-cost CAT cancel is 0.35
  #                                  # mojos/cost against the ~5 a full mempool admits, so a
  #                                  # degraded cancel would never confirm, would keep its
  #                                  # coins locked and would end in a wallet-wide
  #                                  # force-delete.  It is paid in full and reported with one
  #                                  # FeeBudgetUnfunded alert instead.
  #                                  # ONE EXCEPTION, found 2026-09-21 and NOT yet fixed: the
  #                                  # BULK stop/shutdown sweep (wallet cancel_offers) still
  #                                  # pays the single dynamic fee, which with the controller
  #                                  # on IS the offer-attached fee -- so a Cancel All can go
  #                                  # out at min_fee_mojos.  Per-offer cancels are unaffected.
  # CLVM cost per action class, measured on the live wallet 2026-09-20 (321 spend
  # bundles costed with chia_rs).  fee = rate x cost, clamped to [min_fee, max_fee].
  # controller_cost_cancel_xch: 8400000      # cancel of an offer that offered XCH (8.33-8.38M)
  # controller_cost_cancel_cat: 42300000     # cancel of an offer that offered a CAT (42.05-42.26M)
  # controller_cost_take: 125000000          # take_offer (92.6M with one maker coin, +30.5M each)
  # controller_cost_offer_attached: 21000000 # maker's share of a fill; paid only if filled
  #
  # OPERATOR GUIDANCE at full-mempool fee levels (5 mojos/cost x 1.10 margin):
  #   CAT cancel 232650000, XCH cancel 46200000, take 687500000, offer-attached
  #   115500000 mojos.  So:
  #   * max_fee_mojos 100000000 CANNOT get an OFFER-ATTACHED fee, a CAT cancel
  #     or a take into a full mempool -- THREE of the four classes, since all
  #     three figures above (115500000, 232650000, 687500000) are over it.
  #     Only the XCH cancel's 46200000 clears.  The startup log names each one.
  #     Use >= 250000000 to cover the attached fee and cancels, >= 700000000 to
  #     cover takes as well.  (The test is max_fee_mojos < 5 x
  #     controller_ff_margin x cost, i.e. 5.5 mojos/cost at the default margin,
  #     not a bare 5 -- the same margin the feed-forward floor carries.)
  #     CAREFUL WITH THE 700000000 (corrected 2026-09-21).  It covers the
  #     MODELLED take, 5.5 x controller_cost_take 125000000 = 687500000, and
  #     nothing more.  The measured take cost RANGE is 92618934-212112758
  #     (above), and 125000000 was chosen to cover 7 of those 11 bundles, so a
  #     large multi-coin take is under-modelled and the loop will not even ASK
  #     for enough -- raising the cap alone cannot fix that, because the fee is
  #     rate x controller_cost_take.  To price the largest measured take you
  #     need BOTH: controller_cost_take: 212112758 AND max_fee_mojos >=
  #     1166620169 (= 5.5 x 212112758) to let the answer through.  Keeping the
  #     shipped 125000000 model is a defensible choice -- it stops the 7 common
  #     takes overpaying for the 4 rare ones -- but then the 4 rare ones are
  #     under-priced in a full mempool, and the controller answers that by
  #     raising the RATE, which raises every other class with it.
  #   * daily_budget_mojos is spent over fee_window_blocks, NOT over a day, and
  #     FeeTracker::record_fee books an attached fee for every offer POSTED.  At
  #     the measured rate of this wallet (2026-09-20: 152 offers, 134 cancels
  #     split 58 XCH / 76 CAT, up to 6 takes per DAY = 4608 peak heights) a full
  #     mempool costs, per day,
  #         152 x 115500000 = 17556000000   offer-attached
  #          58 x  46200000 =  2679600000   XCH cancels
  #          76 x 232650000 = 17681400000   CAT cancels
  #           6 x 687500000 =  4125000000   takes
  #                          -------------
  #                           42042000000   per day
  #     and at fee_window_blocks 1662 (~8.7 h) one WINDOW is
  #         42042000000 x 1662 / 4608 = 15163585937 mojos.
  #     The budget must not bind in ordinary operation, so carry twice that:
  #         >= 30327171874.  Use 35000000000; 70000000000 is comfortable.
  #     xop::strategy::fee::recommended_window_budget computes this from YOUR
  #     costs, ff_margin and fee_window_blocks and the engine logs it (and warns
  #     when daily_budget_mojos is below it) at startup, so the number here can
  #     never be the stale one.
  #     NB the range 5000000000-15000000000 recommended before 2026-09-20 was
  #     wrong twice over: 5000000000 is LESS than the cancel reserve itself
  #     (25 x 232650000 = 5816250000), and 15000000000 is about one window's
  #     spend, so the budget bound continuously at either end.
  #   * strategy.cancel_escalation_max_fee_mojos caps the #157 re-cancel
  #     separately; raise it alongside max_fee_mojos.

# Inventory aging (T4-09): gradually relax the no-loss floor for positions
# held underwater for an extended period.  Capital locked in permanently-
# underwater positions has an opportunity cost; accepting a small controlled
# loss to free it up can be net-positive.
# --- inventory_aging: OPTIONAL (omit section to disable aging) ---------------
# All fields are OPTIONAL with defaults.
inventory_aging:
  enabled: false                      # Master switch (disabled by default)
  aging_start_blocks: 1000            # Begin relaxation after 1000 blocks (~14.4 h)
  max_loss_relax_bps: 50              # Maximum loss allowed: 50 bps (0.50%)
  relax_rate_bps_per_block: 0.05      # 0.05 bps/block => full 50 bps after ~1000 extra blocks

# --- T4-16: Online Kappa Calibration ----------------------------------------
# The kappa calibrator tracks fill rates at different spread levels and fits
# the fill-intensity decay parameter λ(δ) = A·exp(−κ·δ) using log-linear
# regression.  Runs every calibration_interval_blocks blocks.
# Note: kappa_calibrator settings are currently hardcoded from strategy.kappa;
# these fields are documented for future YAML extraction.
# kappa_calibrator:
#   num_buckets: 10                   # Spread buckets for fill binning
#   bucket_width_bps: 10              # Width of each bucket (bps)
#   min_fills_for_calibration: 20     # Minimum fills before producing estimates
#   decay_factor: 0.95                # Exponential decay for aging observations
#   kappa_min: 0.1                    # Lower bound on fitted κ
#   kappa_max: 10.0                   # Upper bound on fitted κ
#   calibration_interval_blocks: 50   # Run calibration every N blocks (~43 min)

# --- market_data: OPTIONAL (omit section to use defaults) --------------------
# VPIN, OFI, whale detection, and competitor detection parameters.
# All fields are OPTIONAL with defaults shown below.
market_data:
  # Whale detection
  whale_trade_threshold: 50000000000000  # 50 XCH in mojos
  whale_volume_fraction: 0.05            # 5% of 24h volume triggers whale
  whale_window_blocks: 10                # ~520 s observation window
  whale_max_spread_multiplier: 3.0       # Max spread widening during whale activity

  # VPIN (Volume-Synchronized Probability of Informed Trading)
  vpin_bucket_size: 10.0                 # XCH per VPIN volume bucket
  vpin_window_buckets: 50                # Rolling bucket window

  # OFI (Order Flow Imbalance)
  ofi_window_size: 20                    # Snapshots retained for OFI

  # Competitor detection
  enable_competitor_tracking: true
  min_competitor_offer_size: 1000000000000  # 1 XCH in mojos
  competitor_alert_threshold_bps: 50.0   # Alert when competitor spread < this

  # Asymmetric spread during whale activity (0.0 = symmetric, 1.0 = fully asymmetric)
  asymmetric_skew_factor: 0.5

  # CEX data freshness: seconds before CEX weight decays to zero
  cex_freshness_threshold_sec: 120.0
  # Max age (seconds) of an UNCHANGED dexie last-trade print before it is
  # refused as a mid reference. The print is the only blend leg that is
  # history rather than a live quote and it enters at full DEX weight, so
  # an unaged fallback anchors the mid to whenever the pair last traded.
  # Set <= 0 to disable the gate.
  dex_last_trade_max_age_sec: 1800.0

  # Order-book-derived mid-price: use depth-weighted VWAP micro-price from
  # competing offers instead of simple BBO midpoint.  Gives more authority
  # over price determination by analyzing actual liquidity depth.
  orderbook_mid_enabled: true            # true = use depth-weighted orderbook mid
  orderbook_mid_depth: 5                 # Number of levels per side for VWAP

  # [S20 2026-08-24] Published-mid plausibility gate.  One junk print on
  # BYC/wUSDC.b (187.461980 vs a ~1.0 peg, frozen for 12+ hours) valued the
  # whole BYC position at $187/unit, seeded a $15,180 phantom drawdown peak
  # on a freshly restarted process within 40 minutes, and latched the
  # breaker.  Every candidate mid is now checked against an independent
  # anchor -- CEX price, the implied cross triangulated through healthy
  # sibling books (e.g. BYC/wUSDC.b via XCH/wUSDC.b / XCH/BYC), AMM pool
  # price, external fair value, or the peg -- and a breach publishes NO mid
  # instead of a junk one.  A real market move still passes: the band is
  # wide (3x), and a fresh two-sided book with a coherent spread overrides
  # the anchor ("the whole market repriced" evidence a lone absurd resting
  # offer cannot produce).
  mid_gate_enabled: true                    # [OPTIONAL, default: true]
  mid_anchor_band_ratio: 3.0                # [OPTIONAL, default: 3.0] <= 1 disables
  mid_gate_book_confirm_max_spread_bps: 5000.0  # [OPTIONAL, default: 5000]
  mid_gate_max_step_frac: 0.5               # [OPTIONAL, default: 0.5] <= 0 disables

  # [SIDEQUALITY 2026-09-01] Per-SIDE anchor agreement.  A book can be
  # dislocated on ONE side only: XCH/BYC on 2026-09-01 had every bid within
  # 6.4% of the solved anchor and every ask at 3.5x-7.1x it, so its
  # "10,769 bps spread" was an ABSENT ask side rather than a wide market.
  # A side outside this band stops being used as a REFERENCE; its offers
  # stay in the book (the absurdity filter, at 10x here, owns removal).
  #
  # Keep at or below mid_anchor_band_ratio.  Wider, and a side could stay a
  # trusted reference while the mid it implies is refused as implausible --
  # config load warns if you do.
  book_side_anchor_band_ratio: 3.0          # [OPTIONAL, default: 3.0] <= 1 disables
  # Two-sides-agree bypass: a two-sided book at or under this spread is
  # trusted WHOLE however far it sits from the anchor.  A real market-wide
  # repricing moves both sides together and stays coherent -- the same
  # evidence mid_gate_book_confirm_max_spread_bps accepts.  Dislocation is
  # one side moving alone, which always leaves a wide spread behind.
  #
  # LOWERING this takes effect; RAISING it above
  # mid_gate_book_confirm_max_spread_bps does NOT.  The effective value is
  # min(this, mid_gate_book_confirm_max_spread_bps), so the bypass can never
  # trust WHOLE a book the gate itself would refuse to confirm.  0 disables
  # the bypass, and 0 on either knob disables it.
  #
  # Cost of that direction, on purpose: set below the gate's threshold, this
  # can disqualify both sides of a genuinely coherent far-from-anchor book,
  # and the bot then quotes conservatively through a real repricing.  That
  # is fail-closed.  Tune mid_gate_book_confirm_max_spread_bps instead if
  # you want the bypass wider.
  #
  # THAT COST IS NOT ONLY A QUOTING COST.  This same value also decides
  # whether a two-sided book's mid may MARK EQUITY: a book whose own spread
  # exceeds it does not earn mid_valuation_grade, so valuation falls to the
  # carry and, past valuation_carry_ttl_blocks, degrades the cycle and
  # freezes the max-drawdown peak.  Lowering this knob buys quoting safety
  # and spends valuation coverage; budget for both.
  #
  # Setting it to 0 is safe against that: the coherence requirement stands
  # down entirely and the per-side band governs valuation alone, so turning
  # the bypass off can never black out valuation bot-wide.
  book_side_agree_max_spread_bps: 5000.0    # [OPTIONAL, default: 5000]

  implied_cross_max_leg_spread_bps: 1500.0  # [OPTIONAL, default: 1500]
                                            # Max spread for a book to serve as a
                                            # triangle leg.  Sized for a plausibility
                                            # check (3x band), not for valuation:
                                            # implied error ~= the sum of the legs'
                                            # half-spreads, so 1500 bps of leg spread
                                            # is ~15% anchor error against a 200% band.
                                            # A tighter cap (e.g. the S17 valuation
                                            # test's 300) excludes most real books and
                                            # the triangulated anchor never forms.

# --- adverse_selection: OPTIONAL (omit section to use defaults) ---------------
# Bayesian PIN estimator parameters.  All fields are OPTIONAL.
adverse_selection:
  prior_alpha: 2.0                       # Adverse fill pseudo-count (E[PIN] = α/(α+β))
  prior_beta: 8.0                        # Non-adverse fill pseudo-count
  observation_blocks: 10                 # Post-fill observation window (~8.7 min)
  adverse_threshold: 0.003               # 30 bps adverse classification
  max_history: 500                       # Rolling fill window
  decay_factor: 0.0                      # Exponential decay in posterior (0 = none)

# --- market_allocator: OPTIONAL (omit section to use defaults) ----------------
# Dynamic capital allocation across pairs based on spread, volume, competition,
# fill rate, and triangular arb opportunity.  All fields are OPTIONAL.
market_allocator:
  enabled: true                          # Master switch
  eval_interval_blocks: 50               # Re-evaluate every 50 blocks (~43 min)
  min_alloc_pct: 0.10                    # Minimum allocation per pair (10%)
  max_alloc_pct: 0.50                    # Maximum allocation per pair (50%)
  hysteresis_bps: 50                     # Don't reallocate unless score changes by 50 bps
  smooth_alpha: 0.20                     # EMA smoothing for allocation changes
  weight_spread: 1.0                     # Scoring weight for spread attractiveness
  weight_volume: 1.0                     # Scoring weight for 24h volume
  weight_competition: 1.0                # Scoring weight for competitor density
  weight_fill_rate: 1.0                  # Scoring weight for historical fill rate
  weight_tri_arb: 1.0                    # Scoring weight for triangular arb opportunity
  tri_arb_fee_bps: 15                    # Fee estimate for tri-arb scoring
  tri_arb_min_edge_bps: 5               # Min edge for tri-arb to score positively

# --- recovery: OPTIONAL (omit section to use defaults) -----------------------
# XCH recovery mode: when XCH balance drops below threshold, the engine
# enters recovery mode — cancels all offers and aggressively acquires XCH
# by taking market offers at up to max_premium_bps above CEX price.
recovery:
  enabled: true                          # Master switch for recovery mode
  xch_low_threshold: 0.50               # [OPTIONAL, default: 0.50] Enter recovery below this XCH
  xch_recovery_target: 1.0              # [OPTIONAL, default: 1.0]  Exit recovery above this XCH
  max_take_per_block_xch: 0.5           # [OPTIONAL, default: 0.5]  Max XCH to acquire per block
  max_premium_bps: 100                   # [OPTIONAL, default: 100]  Max premium over CEX price to pay
  cancel_on_enter: true                  # [OPTIONAL, default: true] Cancel all offers when entering recovery
  zero_fee_below_xch: 0.001             # [OPTIONAL, default: 0.001] Fee-free recovery when XCH is effectively dust
  # pair_allowlist: ["XCH/wUSDC.b"]      # [OPTIONAL] Restrict recovery takes to supported XCH-base pairs

# --- buyer: OPTIONAL (omit section to use defaults) -------------------------
# Dedicated opportunistic offer-taker flow. Full per-pair settings can live in
# a separate buyer.yaml file referenced by config_path.
buyer:
  enabled: false                         # [OPTIONAL, default: false]
  config_path: "buyer.yaml"             # [OPTIONAL] external buyer config

# --- warp: OPTIONAL (omit section to disable the bridge entirely) ------------
# Automatic warp.green bridging of USDC (Base) -> wUSDC.b (Chia CAT), run in the
# background by the GUI. GUI-only; the C++ engine never reads this section.
# Leave enabled=false (the default) and the bridge stays completely dark.
# The EVM hot-wallet private key is NOT stored here. There is no in-GUI key
# generator in this version: create the DPAPI blob once by hand and paste it into
# secrets.yaml under warp.evm_private_key_dpapi (docs/warp-bridge.md section 3a).
warp:
  enabled: false                         # [OPTIONAL, default: false] master switch
  # [SAFETY, default: true] Rehearsal mode. The bridge does everything -- resolves
  # the receiver, reads the live toll and tip, estimates gas, encodes and SIGNS
  # both Base transactions -- then stops before broadcasting and ends the job at
  # DRY_RUN_OK. Nothing moves on either chain. Set false only after a clean dry
  # run, and go live with a small deposit first (see docs/warp-bridge.md).
  dry_run: true
  base_rpc_url: "https://mainnet.base.org"  # [OPTIONAL] a private RPC (Alchemy/Infura) is more reliable
  # [OPTIONAL, default: 0.005] Base ETH gas reserve, in ETH. The GUI warns on
  # the Warp and Base Wallet pages when the hot wallet drops below this, so
  # you refuel BEFORE jobs start refusing. Distinct from the engine's hard
  # 0.0003 ETH floor, which is the minimum required to sign a relay at all --
  # this is the operator's comfort line. Raise it if you relay often; set 0
  # to switch the warning off. Editable in Settings -> Fees & Reserves.
  min_base_eth: 0.005
  auto_bridge: false                     # [OPTIONAL, default: false] bridge deposits automatically
  min_auto_bridge_usdc: 100              # [OPTIONAL] AUTO-bridge floor only; "Bridge now" ignores it
  max_auto_bridge_usdc: 10000            # [REQUIRED when enabled] blast-radius cap, manual included; 'unlimited' to opt out

  # Target-band rebalancer (optional; ships inert). Keeps the Base hot
  # wallet at stated targets: excess USDC auto-bridges to Chia, a USDC
  # deficit auto-unwraps back (requires max_unwrap_usdc), excess ETH
  # wraps into milliETH, and an ETH deficit refuels from held milliETH.
  # Acts only outside target*(1 +/- tolerance_pct/100), moves back to
  # target, one action per cooldown, only while no warp job is active.
  # The ETH band bottom must clear the relay-gas floor (0.0003 ETH) and
  # its half-width must be at least twice that floor (gas-churn guard).
  # USDC tolerance_pct must be at least 1 (the band must absorb the
  # 0.3% unwrap tip) and the half-width at least 0.001 USDC (one mojo).
  # While enabled, the rebalancer OWNS automatic bridging: auto_bridge
  # above stands down, and bridging happens per the usdc band (so with an
  # eth-only band, USDC moves only on an operator's "Bridge now").
  # ROLLOUT: leave the usdc block off until the first live 0.001-USDC
  # micro-unwrap protocol test has succeeded -- the deficit leg fires
  # real burns. The ETH block and the excess-bridge leg are safe first.
  # rebalance:
  #   enabled: true
  #   cooldown_s: 600
  #   usdc: {target: 100, tolerance_pct: 20}
  #   eth:  {target: 0.01, tolerance_pct: 20}
  claim_fee_mojos: 100000000             # [OPTIONAL] XCH fee reserved for the Chia claim spend (0.0001 XCH)
  chia_funding_fee_mojos: 0              # [OPTIONAL] extra fee on the wallet->claim funding send
  poll_interval_s: 15                    # [OPTIONAL, default: 15] background tick cadence
  coinset_url: ""                        # [OPTIONAL] override coinset API base (blank = network default)
  chia_receiver_address: ""              # [OPTIONAL] where wUSDC.b lands (blank = bot's own wallet address)
  # Correctness anchor, checked at STARTUP before any client is built: the
  # wrapped-asset TAIL is re-derived offline and must equal this, or the engine
  # refuses to start and the Warp tab shows a blocked banner. A typo here is a
  # blocked bridge, never a lost deposit. This is the Base-bridged wUSDC.b CAT.
  expected_asset_id: "fa4a180ac326e67ea289b869e3448256f6af05721f7cf934cb9901baa6b7a99d"
