# =============================================================================
# compile-check.yml — XOPTrader compile-error check
#
# Runs on every push and pull request to catch C++ and Python compile errors
# before they land on the main branch.
#
# C++ check  — full CMake + vcpkg build on Ubuntu (GCC, C++20)
# Python check — compileall-based syntax scan of all .py files
# =============================================================================

name: Compile Check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — C++ compile check (Ubuntu, GCC, vcpkg managed dependencies)
  # ---------------------------------------------------------------------------
  cpp-compile:
    name: C++ compile check (Ubuntu)
    runs-on: ubuntu-22.04
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      VCPKG_BINARY_SOURCES: "x-gha,readwrite"
      VCPKG_HTTP_RETRY_COUNT: "10"
      VCPKG_HTTP_TIMEOUT: "300"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- System dependencies ---------------------------------------------
      #
      # GCC 13, not the runner image's default GCC 11.  GCC 11 ICEs on lambda
      # coroutines that bind a class-type co_await result into their frame
      # ("in build_special_member_call, at cp/call.c:10200"), which a codebase
      # built on asio::awaitable hits readily.  jammy carries no gcc-13, hence
      # the toolchain PPA.  The runner image itself stays on ubuntu-22.04 so
      # the release binaries keep their glibc floor.
      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libcurl4-openssl-dev \
            gcc-13 g++-13
          # Export the toolchain before vcpkg is set up so the ports are built
          # by the same compiler as the project.  This job builds Debug, which
          # does not use LTO, so a mixed GCC 11/13 link happens to work here --
          # but it broke the Release link in release.yml, where
          # CMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE is ON and GCC 13's lto1
          # cannot read GCC 11 bytecode.  Keep the two workflows identical.
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      # ---- Read vcpkg baseline from manifest (single source of truth) -------
      - name: Read vcpkg baseline
        id: vcpkg-baseline
        run: echo "sha=$(jq -r '.["builtin-baseline"]' cpp/vcpkg.json)" >> "$GITHUB_OUTPUT"

      # ---- Ensure vcpkg-downloads directory exists before bootstrap -----------
      - name: Create vcpkg downloads directory
        shell: bash
        run: mkdir -p "$VCPKG_DOWNLOADS"

      # ---- Cache vcpkg source archives to survive transient download errors --
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ steps.vcpkg-baseline.outputs.sha }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      # ---- vcpkg setup with caching ----------------------------------------
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "cpp/vcpkg.json"
          vcpkgGitCommitId: "${{ steps.vcpkg-baseline.outputs.sha }}"

      # ---- CMake configure -------------------------------------------------
      - name: Configure CMake
        working-directory: cpp
        run: >
          cmake -B ../build -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DXOP_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux

      # ---- Build (compile-error check) -------------------------------------
      - name: Build
        run: cmake --build build --config Debug --parallel

      # ---- Run the C++ suite -----------------------------------------------
      # The build above already produces xop_tests, so running it here costs
      # only the test time.  Without this, ctest ran solely in the release
      # workflow (release.yml), which meant a C++ change could merge with a
      # red suite and only fail at tag time -- after review had passed.
      - name: C++ tests
        run: ctest --test-dir build --build-config Debug --output-on-failure

  # ---------------------------------------------------------------------------
  # Job 2 — Python syntax check
  # ---------------------------------------------------------------------------
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q -x '(^|/)\.git(/|$)' .
          echo "All Python files compiled without errors."

  # ---------------------------------------------------------------------------
  # Job 3 — Python test suite
  #
  # No CI job had ever run pytest: compileall is a syntax scan (it passes on a
  # file whose every assertion is wrong) and ctest covers C++ only.  This job
  # is deliberately independent of the C++ job -- a red engine build must not
  # go on hiding the Python side, which is how the warp bridge landed with
  # ~290 tests that automation had never executed once.
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Qt needs these present even under the offscreen platform plugin.
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      # `pip install -e ".[gui,dev]"` -- the path gui/requirements.txt calls
      # canonical -- fails: pyproject.toml declares no [tool.setuptools], so
      # flat-layout auto-discovery trips over the ten top-level directories.
      # Install the requirements file directly until that is fixed.
      #
      # --only-binary is scoped to the compiled extensions it is meant for.
      # `:all:` would apply to all 50+ transitive distributions, so a single
      # sdist-only release anywhere in the tree would turn this job red for a
      # reason unrelated to the repo.
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --only-binary=chia_rs,PySide6,pyqtgraph -r gui/requirements.lock.txt
          pip install -r gui/requirements-tools.lock.txt

      # Every warp test module opens with pytest.importorskip("clvm") /
      # ("chia_rs").  If those wheels are absent the suite drops from 244 tests
      # to 76 and still reports success -- green while covering a third of the
      # bridge.  Fail here instead, where the cause is legible.
      - name: Verify the warp dependencies actually installed
        run: |
          python - <<'PY'
          import importlib.util
          missing = [m for m in ("clvm", "chia_rs", "eth_account", "eth_utils")
                     if importlib.util.find_spec(m) is None]
          if missing:
              raise SystemExit(
                  "warp dependencies missing: " + ", ".join(missing) +
                  " -- the warp suite would skip silently and report green")
          print("warp dependencies present")
          PY

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
