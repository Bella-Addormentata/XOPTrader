# =============================================================================
# release.yml — XOPTrader automated release workflow
#
# Triggers on a version tag push (v*) or manual workflow_dispatch.
# Builds the C++ engine and Python GUI for three platforms and attaches
# all artifacts to a new GitHub Release.
#
# Artifacts included in the release
# -----------------------------------
# All files are placed under RELEASE/XOPTrader-{slug}/ (e.g. XOPTrader-020
# for v0.2.0) and bundled into XOPTrader-{slug}.zip. Each versioned binary
# also carries the release tag in its filename.
#
#   xop_trader-installer-windows-x64-{tag}.exe  Windows installer with desktop shortcut
#   xop_trader-linux-x64-{tag}                  C++ engine — Ubuntu 22.04 x86-64
#   xop_trader-macos-arm64-{tag}                C++ engine — macOS 14 Apple-Silicon
#   xop_trader-installer-windows-x64-{tag}.exe  Windows installer with desktop-shortcut prompt
#   xop_trader-gui-linux-x64-{tag}              Python GUI — Ubuntu (PyInstaller)
#   xop_trader-linux-bundle-{tag}.tar.gz        Linux bundle: GUI binary + icon + .desktop + install.sh
#   xop_trader-gui-macos-arm64-{tag}            Python GUI — macOS (PyInstaller)
#   config.example.yaml                         Reference configuration file
#   XOPTrader-{slug}.zip                        Full release bundle (RELEASE/{folder}/ tree)
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1)"
        required: true
        default: "v0.1"
      publish:
        description: "Create the GitHub Release. Uncheck to exercise the build matrix without publishing anything."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Prevent duplicate runs when a release also creates a tag push.  Both of those
# events leave `inputs` unset, so they still share a group and still dedupe.
#
# `inputs.publish` is in the key so a non-publishing dry run can never cancel a
# real release of the same ref -- cancel-in-progress would otherwise kill it,
# and notify-on-failure does not fire on cancellation, so it would vanish
# silently.  That hazard only exists because dry runs are now possible at all.
concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.publish }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job 1 — Build the C++ engine on each OS
# ---------------------------------------------------------------------------
jobs:
  build-cpp:
    name: C++ engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      VCPKG_BINARY_SOURCES: "x-gha,readwrite"
      VCPKG_HTTP_RETRY_COUNT: "10"
      VCPKG_HTTP_TIMEOUT: "300"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: xop_trader-windows-x64.exe
            cmake_build_type: Release
            binary_path: build/Release/xop_trader.exe
          - os: ubuntu-22.04
            artifact_name: xop_trader-linux-x64
            cmake_build_type: Release
            binary_path: build/xop_trader
          - os: macos-latest
            artifact_name: xop_trader-macos-arm64
            cmake_build_type: Release
            binary_path: build/xop_trader

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- System dependencies (Ubuntu) ------------------------------------
      #
      # GCC 13, not the runner image's default GCC 11 -- see the note in
      # compile-check.yml.  jammy carries no gcc-13, hence the toolchain PPA.
      #
      # The runner image deliberately stays on ubuntu-22.04: it sets the glibc
      # floor for xop_trader-linux-x64, and moving to 24.04 would raise that
      # floor for everyone already running the binary.  GCC 13 does raise the
      # *libstdc++* floor the same way (jammy ships GLIBCXX_3.4.30; GCC 13
      # emits references to 3.4.32), so the Linux link below is static for
      # libstdc++/libgcc.  glibc stays dynamic -- it is the compatibility
      # boundary we are preserving, and static glibc breaks NSS anyway.
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libcurl4-openssl-dev \
            gcc-13 g++-13
          # vcpkg builds its ports with whatever compiler the environment
          # names, and CMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE is ON
          # (cpp/CMakeLists.txt:104).  Ports built by GCC 11 emit LTO 11.3
          # bytecode that GCC 13's lto1 refuses to read, so exporting the
          # toolchain here -- before vcpkg is set up -- is what keeps the
          # Release link working.  Debug does not use LTO and never saw this.
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      # ---- Read vcpkg baseline from manifest (single source of truth) -------
      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: echo "sha=$(jq -r '.["builtin-baseline"]' cpp/vcpkg.json)" >> "$GITHUB_OUTPUT"

      # ---- Ensure vcpkg-downloads directory exists before bootstrap -----------
      - name: Create vcpkg downloads directory
        shell: bash
        run: mkdir -p "$VCPKG_DOWNLOADS"

      # ---- Cache vcpkg source archives to survive transient download errors --
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ matrix.os }}-${{ steps.vcpkg-baseline.outputs.sha }}
          restore-keys: |
            vcpkg-downloads-${{ matrix.os }}-

      # ---- vcpkg setup with caching ----------------------------------------
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "cpp/vcpkg.json"
          vcpkgGitCommitId: "${{ steps.vcpkg-baseline.outputs.sha }}"


      # ---- System dependencies (macOS) -------------------------------------
      # sqlite3 is excluded from vcpkg on macOS (sqlite.org is unreachable from
      # macOS runners); CMake's find_package(SQLite3) falls back to the system
      # SQLite3 provided by the macOS Command Line Tools SDK (no brew install
      # needed). Ninja is required for the generator selection below.
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ---- CMake configure & build -----------------------------------------
      - name: Configure CMake
        working-directory: cpp
        shell: bash
        env:
          # CMake seeds CMAKE_EXE_LINKER_FLAGS from LDFLAGS on first configure.
          # Empty on Windows/macOS, which CMake ignores.
          LDFLAGS: ${{ runner.os == 'Linux' && '-static-libstdc++ -static-libgcc' || '' }}
        run: >
          cmake -B ../build -S .
          ${{ runner.os != 'Windows' && '-G Ninja' || '' }}
          ${{ runner.os == 'Linux' && '-DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13' || '' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }}
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ runner.os == 'Windows' && 'x64-windows' || runner.os == 'Linux' && 'x64-linux' || 'arm64-osx' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.cmake_build_type }} --parallel

      - name: Stage Windows runtime bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix install
          New-Item -ItemType Directory -Force -Path windows-runtime | Out-Null
          Copy-Item install\bin\* windows-runtime\
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "windows-runtime\VC_redist.x64.exe"

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.cmake_build_type }} --output-on-failure

      # ---- Rename binary to platform-specific name -------------------------
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary_path }}" "${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: xop_trader-windows-runtime-x64
          path: windows-runtime/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2a — Python GUI for the Unix platforms
  #
  # Deliberately carries no `needs: [build-cpp]`.  Only the Windows GUI embeds a
  # C++ artifact, so gating these two on the engine build meant a red C++ job
  # hid every GUI and packaging defect behind it -- which is exactly how the
  # problems fixed in this file survived unseen from 2026-04-08 onward.
  # ---------------------------------------------------------------------------
  build-gui:
    name: Python GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: xop_trader-gui-linux-x64
            icon_fmt: png
          - os: macos-latest
            artifact_name: xop_trader-gui-macos-arm64
            icon_fmt: icns

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---- Ubuntu system libs for PySide6 ----------------------------------
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        working-directory: gui
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---- Copy pre-built application icon --------------------------------
      - name: Copy application icon
        working-directory: gui
        shell: bash
        run: cp resources/icon.${{ matrix.icon_fmt }} icon.${{ matrix.icon_fmt }}

      # ---- Build with PyInstaller ------------------------------------------
      #
      # This step runs with working-directory: gui, but main.py opens with
      # `from gui.app import XOPTraderApp` and gui/app.py does `import gui` --
      # absolute imports of the package that *contains* them.  From gui/ there
      # is no gui/gui/, so the package is not importable and PyInstaller cannot
      # follow the entry point's own imports; `--collect-submodules gui` also
      # silently returns [] and logs it at debug level.  --paths/PYTHONPATH put
      # the repo root on the search path so both resolve.
      #
      # --exclude-module: with the package importable, --collect-submodules
      # would otherwise force-import the 10 warp test modules (~4,600 lines)
      # into the bundle, every one of which imports pytest -- a dev-only
      # dependency that is not installed here.
      #
      # This combination logs ten lines of
      #   ERROR: Hidden import 'gui.services.warp.tests.test_*' not found
      # which are expected and not failures: --collect-submodules enumerates
      # them, --exclude-module then removes them, and PyInstaller reports the
      # gap it just created.  Verified against a local build -- the resulting
      # bundle contains no test module and no pytest.
      #
      # --add-data: PyInstaller bundles no non-Python file it is not told
      # about, and four things here are read from disk rather than imported:
      #   * the 12 .clsp.hex puzzle reveals -- clvm_utils.py resolves them as
      #     Path(__file__).parent/"puzzles" and read_text()s them, and
      #     drivers.py load_puzzle()s all 12 at module scope, so without them
      #     the whole warp module raises on import;
      #   * scripts/offer_sizing.py -- loaded by file path (gui/utils.py), so
      #     the import graph never sees it;
      #   * the two example configs -- first-run bootstrap copies them out.
      # Relative sources resolve against the spec directory; no --specpath is
      # passed, so the spec lands in gui/ and these paths are correct.
      - name: Build with PyInstaller
        working-directory: gui
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pyinstaller
          --onefile
          --name xop_trader_gui
          --windowed
          --paths ..
          --collect-submodules gui
          --exclude-module gui.services.warp.tests
          --add-data "services/warp/puzzles/*.clsp.hex:gui/services/warp/puzzles"
          --add-data "../scripts/offer_sizing.py:scripts"
          --add-data "../config.example.yaml:."
          --add-data "../secrets.example.yaml:."
          --hidden-import requests
          --icon icon.${{ matrix.icon_fmt }}
          main.py

      # ---- Prove the bundle is not dead on arrival -------------------------
      #
      # PyInstaller exits 0 on missing-module and missing-data warnings, and
      # `if-no-files-found: error` on the upload only proves a file exists --
      # so nothing downstream can tell a working bundle from a broken one.
      #
      # `--help` proves the gui package itself made it in: it returns through
      # argparse, but not before main.py's module-level `from gui.app import
      # XOPTraderApp` has run.
      #
      # It proves nothing about bundled DATA, though -- argparse returns at
      # main.py's parse_args long before anything reads a file, and
      # gui.services.warp.drivers is imported lazily, so a broken --add-data
      # still exits 0.  --self-check is what actually covers that: it imports
      # drivers (all 12 puzzle reveals), loads scripts/offer_sizing.py by path,
      # and stats both example configs.
      - name: Smoke-test the bundle
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/xop_trader_gui --help
          ./dist/xop_trader_gui --self-check

      - name: Rename binary
        run: cp gui/dist/xop_trader_gui ${{ matrix.artifact_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2b — Python GUI for Windows
  #
  # The one GUI leg with a genuine dependency on build-cpp: it embeds the engine
  # runtime DLLs and the VC redistributable staged by that job.
  #
  # There is no smoke-test step here.  --windowed leaves the executable no
  # console subsystem, so sys.stdout/stderr are None and argparse's own --help
  # handler raises.  The defect the Unix smoke test guards against (the gui
  # package missing from the bundle) is platform-independent, so those legs
  # cover it; a Windows-specific check needs a self-test entry point in the app.
  # ---------------------------------------------------------------------------
  build-gui-windows:
    name: Python GUI (windows-latest)
    needs: [build-cpp]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        working-directory: gui
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Windows runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: xop_trader-windows-runtime-x64
          path: gui/engine-runtime

      - name: Copy application icon
        working-directory: gui
        shell: bash
        run: cp resources/icon.ico icon.ico

      # See the Unix leg above for why --paths/PYTHONPATH, --exclude-module and
      # --add-data are all required.
      - name: Build with PyInstaller (bundled engine runtime)
        working-directory: gui
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $args = @(
            '--onefile',
            '--name', 'xop_trader_gui',
            '--windowed',
            '--paths', '..',
            '--collect-submodules', 'gui',
            '--exclude-module', 'gui.services.warp.tests',
            # ';' separator to match the --add-binary calls below.
            '--add-data', 'services/warp/puzzles/*.clsp.hex;gui/services/warp/puzzles',
            '--add-data', '../scripts/offer_sizing.py;scripts',
            '--add-data', '../config.example.yaml;.',
            '--add-data', '../secrets.example.yaml;.',
            '--hidden-import', 'requests',
            '--icon', 'icon.ico'
          )

          Get-ChildItem engine-runtime -File | ForEach-Object {
            $args += '--add-binary'
            $args += "$($_.FullName);engine-runtime"
          }

          $args += 'main.py'
          pyinstaller @args

      # This leg had no smoke test until --self-check existed.  --windowed
      # leaves the executable no console subsystem, so sys.stdout/stderr are
      # None and argparse's --help handler raises -- but --self-check reports
      # through its exit code and only writes when a stream exists, so it
      # works here.  This is the bundle that embeds the engine and the only
      # platform warp supports, so it is the one that most needed covering.
      - name: Smoke-test the bundle
        working-directory: gui
        shell: pwsh
        env:
          # No console subsystem here, so the report cannot come back on
          # stdout -- the exe appends it to this file instead.
          XOP_SELF_CHECK_REPORT: ${{ runner.temp }}\self-check.txt
        run: |
          $report = "${{ runner.temp }}\self-check.txt"
          if (Test-Path $report) { Remove-Item $report }

          # Start-Process -Wait, not the call operator.  A --windowed build is
          # a GUI-subsystem binary, and PowerShell does not block on those: `&`
          # returns immediately, leaving $LASTEXITCODE empty and the report
          # unwritten, then the process runs seconds later with nothing reading
          # its result.  That reported a passing bundle as a failure once
          # already.
          $exe = Join-Path (Get-Location) 'dist\xop_trader_gui.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru

          if (Test-Path $report) { Get-Content $report } else { Write-Host "(no report written)" }
          if ($proc.ExitCode -ne 0) {
            throw "bundle self-check failed with exit code $($proc.ExitCode)"
          }

      - name: Rename binary
        shell: pwsh
        run: Copy-Item "gui\dist\xop_trader_gui.exe" "xop_trader-gui-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: xop_trader-gui-windows-x64.exe
          path: xop_trader-gui-windows-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3 — Windows Installer (needs both C++ engine and GUI artifacts)
  # ---------------------------------------------------------------------------
  build-installer:
    name: Windows Installer
    needs: [build-cpp, build-gui-windows]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy application icon
        run: cp gui/resources/icon.ico gui/icon.ico

      - name: Download C++ engine artifact
        uses: actions/download-artifact@v4
        with:
          name: xop_trader-windows-x64.exe
          path: dl/

      - name: Download C++ runtime bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: xop_trader-windows-runtime-x64
          path: dl/runtime/

      - name: Download GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: xop_trader-gui-windows-x64.exe
          path: dl/

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          # Resolve AppVersion from tag (strip leading 'v'), fall back to "0.1"
          $version = if ($env:GITHUB_REF -match "refs/tags/v(.+)") { $Matches[1] } `
                     elseif ("${{ github.event.inputs.tag }}" -match "v(.+)") { $Matches[1] } `
                     else { "0.1" }

          # Stage files with the names installer.iss expects
          New-Item -ItemType Directory -Force -Path installer-staging
          Copy-Item dl\xop_trader-windows-x64.exe     installer-staging\xop_trader.exe
          Copy-Item dl\xop_trader-gui-windows-x64.exe installer-staging\xop_trader_gui.exe
          Copy-Item dl\runtime\*.dll                  installer-staging\
          Copy-Item dl\runtime\VC_redist.x64.exe      installer-staging\
          Copy-Item packaging\windows\installer.iss    installer-staging\
          Copy-Item gui\icon.ico                       installer-staging\
          Copy-Item config.example.yaml                installer-staging\

          # Compile the installer
          iscc /DAppVersion=$version `
               /O"installer-staging" `
               installer-staging\installer.iss

          Copy-Item installer-staging\xop_trader-installer-windows-x64.exe .

      # A compiled installer is not a working installer: v0.9.0 shipped one
      # that died at launch ("Bitmap image is not valid" -- an .ico fed to
      # WizardSmallImageFile compiles but cannot be decoded at run time).
      # Actually EXECUTE every built installer: silent install, verify the
      # payload landed, silent uninstall. Start-Process -Wait -PassThru is
      # deliberate -- a bare & does not block on GUI-subsystem binaries.
      - name: Smoke-test the installer (install, verify payload, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\xop_trader-installer-windows-x64.exe" `
                -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\XOPSmoke" `
                -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          foreach ($f in "xop_trader_gui.exe","xop_trader.exe","config.example.yaml","icon.ico") {
            if (-not (Test-Path "C:\XOPSmoke\$f")) { throw "missing $f after install" }
          }
          $dlls = (Get-ChildItem "C:\XOPSmoke\*.dll").Count
          if ($dlls -lt 5) { throw "expected the engine runtime DLLs, found $dlls" }
          # An installed payload is not a working app: v0.9.1 installed fine
          # and then the engine never started -- every write (config
          # bootstrap, engine.log, DB) targeted the unwritable install dir.
          # LAUNCH the installed GUI as this (non-elevated) runner user and
          # assert the first-run machinery actually ran: config bootstrapped
          # into the per-user data dir and the engine was spawned there.
          $env:QT_QPA_PLATFORM = "offscreen"
          # -WorkingDirectory pins the CWD to a neutral location: the v0.9.1
          # bug class was CWD-relative defaults, and a launch from the repo
          # checkout would mask it. The app must choose its own home.
          $gui = Start-Process -FilePath "C:\XOPSmoke\xop_trader_gui.exe" `
                -WorkingDirectory "C:\" -PassThru
          Start-Sleep -Seconds 60
          # Two legitimate homes: the install dir itself when writable (the
          # runner is elevated, so C:\XOPSmoke qualifies -- the portable
          # layout), else %LOCALAPPDATA%\XOPTrader. Anything else -- notably
          # the CWD -- is the bug class this gate exists for.
          $homes = @("C:\XOPSmoke", (Join-Path $env:LOCALAPPDATA "XOPTrader"))
          $home_ = $homes | Where-Object { Test-Path (Join-Path $_ "config.yaml") } | Select-Object -First 1
          if (-not $home_) {
            throw "config.yaml was not bootstrapped into any legitimate home ($($homes -join ', '))"
          }
          Write-Host "app home resolved to: $home_"
          if (Test-Path "C:\config.yaml") {
            throw "config.yaml landed in the CWD -- the CWD-relative default is back"
          }
          if (-not (Test-Path (Join-Path $home_ "engine.log"))) {
            throw "engine.log missing in $home_ -- the engine was never spawned"
          }
          $engineAlive = Get-Process -Name xop_trader -ErrorAction SilentlyContinue
          $logBytes = (Get-Item (Join-Path $home_ "engine.log")).Length
          if ((-not $engineAlive) -and ($logBytes -eq 0)) {
            throw "engine not running and engine.log empty -- launch failed"
          }
          if (-not $engineAlive) {
            Write-Warning "engine exited on the runner (no Chia here) -- log has $logBytes bytes, spawn itself worked"
          }
          Stop-Process -Name xop_trader     -Force -ErrorAction SilentlyContinue
          Stop-Process -Name xop_trader_gui -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $un = Start-Process -FilePath "C:\XOPSmoke\unins000.exe" `
                -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" `
                -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "uninstaller exited $($un.ExitCode)" }
          Write-Host "installer smoke test passed: install + payload + first-run launch + uninstall"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xop_trader-installer-windows-x64
          path: xop_trader-installer-windows-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 4 — Linux Install Bundle (needs both C++ engine and GUI artifacts)
  # ---------------------------------------------------------------------------
  build-linux-bundle:
    name: Linux Install Bundle
    needs: [build-cpp, build-gui]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Copy application icon
        run: cp gui/resources/icon.png gui/icon.png

      - name: Download C++ engine artifact
        uses: actions/download-artifact@v4
        with:
          name: xop_trader-linux-x64
          path: dl/

      - name: Download GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: xop_trader-gui-linux-x64
          path: dl/

      - name: Build Linux install bundle
        run: |
          mkdir -p linux-bundle
          cp dl/xop_trader-linux-x64            linux-bundle/xop_trader
          cp dl/xop_trader-gui-linux-x64        linux-bundle/xop_trader_gui
          cp gui/icon.png                       linux-bundle/
          cp config.example.yaml                linux-bundle/
          cp packaging/linux/xop_trader.desktop  linux-bundle/
          cp packaging/linux/install.sh          linux-bundle/
          cp packaging/linux/uninstall.sh        linux-bundle/
          chmod +x linux-bundle/install.sh linux-bundle/uninstall.sh \
                   linux-bundle/xop_trader_gui linux-bundle/xop_trader
          tar -czf xop_trader-linux-bundle.tar.gz -C linux-bundle .

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: xop_trader-linux-bundle
          path: xop_trader-linux-bundle.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 5 — Create the GitHub Release and upload all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-cpp, build-gui, build-gui-windows, build-installer, build-linux-bundle]
    runs-on: ubuntu-22.04
    # Tag pushes and published-release events always publish; only a manual
    # dispatch can opt out, so this cannot change the behaviour of a real
    # release.  Unchecking `publish` runs the whole matrix and stops short of
    # creating anything -- the only way to exercise this pipeline end to end
    # without leaving a release behind.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      - uses: actions/checkout@v4

      # Download every artifact uploaded by the build jobs into a temp directory
      # to avoid name collisions (artifact folder names match the target file names)
      - uses: actions/download-artifact@v4
        with:
          path: release-assets-tmp/

      # Flatten the nested per-artifact directories into release-assets/
      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find release-assets-tmp -type f -exec mv -t release-assets/ {} +
          rm -rf release-assets-tmp

      # Remove the standalone Windows GUI binary — users should use the installer
      - name: Exclude standalone Windows binaries from release
        run: |
          rm -f release-assets/xop_trader-gui-windows-x64.exe
          rm -f release-assets/xop_trader-windows-x64.exe

      # Resolve the tag: prefer the real git tag, fall back to workflow_dispatch input
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Compute a compact version slug: v0.2.0 → 020  (strip 'v', remove dots)
      - name: Compute version slug
        id: version
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          SLUG="${TAG#v}"
          SLUG="${SLUG//./}"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "folder=XOPTrader-${SLUG}" >> "$GITHUB_OUTPUT"

      # Organise all artifacts into RELEASE/{folder}/ with versioned filenames,
      # then create a zip archive of the entire RELEASE/ tree.
      - name: Organise versioned release folder
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          FOLDER="${{ steps.version.outputs.folder }}"
          SLUG="${{ steps.version.outputs.slug }}"
          DEST="RELEASE/${FOLDER}"
          mkdir -p "${DEST}"

          # Include the example config alongside the built artifacts
          cp config.example.yaml release-assets/config.example.yaml

          for f in release-assets/*; do
            name=$(basename "$f")
            case "$name" in
              *.tar.gz)
                base="${name%.tar.gz}"
                cp "$f" "${DEST}/${base}-${TAG}.tar.gz" ;;
              xop_trader*.exe)
                base="${name%.exe}"
                cp "$f" "${DEST}/${base}-${TAG}.exe" ;;
              *.exe)
                # Third-party runtime executables keep their original name
                cp "$f" "${DEST}/${name}" ;;
              *.yaml)
                # Keep config files with their original name (no version suffix)
                cp "$f" "${DEST}/${name}" ;;
              *.dll | *.pdb)
                # Windows runtime DLLs keep their original name
                cp "$f" "${DEST}/${name}" ;;
              *)
                # Linux/macOS binaries and other extension-less files
                cp "$f" "${DEST}/${name}-${TAG}" ;;
            esac
          done

          # Bundle the entire RELEASE/ folder tree into a single zip archive
          zip -r "XOPTrader-${SLUG}.zip" "RELEASE/"

      # Delete existing release assets so the new build replaces them
      - name: Remove old release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          # Check if a release already exists for this tag
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG exists — deleting old assets…"
            gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | while read -r asset; do
              echo "  Deleting: $asset"
              gh release delete-asset "$TAG" "$asset" --repo "${{ github.repository }}" --yes
            done
          else
            echo "No existing release for $TAG — nothing to clean up."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "XOPTrader ${{ steps.tag.outputs.value }}"
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## XOPTrader ${{ steps.tag.outputs.value }}

            Automated release of the XOPTrader CHIA DEX market-making engine.

            ### Included artifacts

            All files are also bundled together in **`XOPTrader-${{ steps.version.outputs.slug }}.zip`**
            under `RELEASE/XOPTrader-${{ steps.version.outputs.slug }}/`.

            | File | Description |
            |------|-------------|
            | `XOPTrader-${{ steps.version.outputs.slug }}.zip` | **Full release bundle** — all artifacts inside `RELEASE/XOPTrader-${{ steps.version.outputs.slug }}/` |
            | `xop_trader-installer-windows-x64-${{ steps.tag.outputs.value }}.exe` | **Windows installer** — installs everything + creates desktop shortcut |
            | `xop_trader-linux-bundle-${{ steps.tag.outputs.value }}.tar.gz` | **Linux bundle** — GUI binary + icon + `.desktop` + `install.sh` |
            | `xop_trader-gui-linux-x64-${{ steps.tag.outputs.value }}` | Linux GUI standalone binary (no installer) |
            | `xop_trader-linux-x64-${{ steps.tag.outputs.value }}` | C++ engine — Ubuntu 22.04 x86-64 |
            | `xop_trader-gui-macos-arm64-${{ steps.tag.outputs.value }}` | Python GUI — macOS (standalone) |
            | `xop_trader-macos-arm64-${{ steps.tag.outputs.value }}` | C++ engine — macOS 14 Apple-Silicon |
            | `config.example.yaml` | Reference configuration file |
            | `Source code (.zip / .tar.gz)` | GitHub-generated source archives |

            ### Quick start

            **Windows** — run the installer and follow the wizard:
            ```
            xop_trader-installer-windows-x64-${{ steps.tag.outputs.value }}.exe
            ```
            The installer will offer to create a desktop shortcut (optional, unchecked by default).

            **Linux** — extract the bundle and run the install script:
            ```bash
            tar -xzf xop_trader-linux-bundle-${{ steps.tag.outputs.value }}.tar.gz
            ./install.sh          # prompts: "Create a desktop shortcut?" [Y/n]
            # or: ./install.sh --no-desktop  (skip the prompt)
            ```

            **macOS** — run the GUI binary directly; drag it to Applications if you wish:
            ```bash
            chmod +x xop_trader-gui-macos-arm64-${{ steps.tag.outputs.value }}
            ./xop_trader-gui-macos-arm64-${{ steps.tag.outputs.value }}
            ```

            **All platforms** — copy the example config and edit before first run:
            ```bash
            cp config.example.yaml config.yaml
            # edit config.yaml with your credentials
            ./xop_trader-{platform}-${{ steps.tag.outputs.value }} --config config.yaml
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          draft: false
          prerelease: false
          files: |
            RELEASE/${{ steps.version.outputs.folder }}/*
            XOPTrader-${{ steps.version.outputs.slug }}.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Job 6 — Create a GitHub issue when the release workflow fails
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-22.04
    needs: [build-cpp, build-gui, build-gui-windows, build-installer, build-linux-bundle, release]
    # A non-publishing dispatch is a deliberate pipeline test, so a failure is
    # the expected outcome being measured, not an incident worth filing.
    if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    permissions:
      issues: write     # needed to create failure notification issues

    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 Release workflow failed (run #${context.runNumber})`;
            const body = [
              `The **Release** workflow failed.`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| Run | [#${context.runNumber}](${run_url}) |`,
              `| Ref | \`${context.ref}\` |`,
              `| Triggered by | @${context.actor} |`,
              `| Event | \`${context.eventName}\` |`,
              ``,
              `Please investigate the [failed run](${run_url}) and fix any issues before re-running the release.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug'],
            });
